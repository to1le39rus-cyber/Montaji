<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3ee"><title>Монтажи AA — iPhone V5</title><style>
:root{--bg:#f3f3ee;--ink:#171916;--muted:#7c8077;--line:#dddeda;--card:#fff;--olive:#66745c;--olive2:#e8ece4;--red:#b34f45;--red2:#fae9e6;--yellow:#9b792c;--yellow2:#f8f0d9}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}.app{max-width:600px;margin:auto;padding:0 14px}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top)}.brand{font-size:13px;font-weight:900;letter-spacing:.18em}.date{font-size:12px;color:var(--muted);margin-top:4px}.sync{font-size:10px;color:var(--olive);font-weight:800}.hello{padding:15px 0 8px}.hello h1{font-size:30px;line-height:1.02;letter-spacing:-.05em;margin:0}.hello p{color:var(--muted);margin:7px 0 0;font-size:13px}.money{background:var(--ink);color:#fff;border-radius:25px;padding:19px;margin-top:10px;box-shadow:0 16px 38px #0002}.money .cap{color:#aeb4a9;text-transform:uppercase;letter-spacing:.12em;font-size:9px}.money .num{font-size:43px;font-weight:850;letter-spacing:-.07em;margin:5px 0}.money .sub{display:flex;gap:25px;color:#aeb4a9;font-size:10px}.money b{color:#fff;font-size:12px;display:block;margin-top:2px}.queue{margin-top:23px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:850;color:#777b73;margin:0 2px 8px}.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:13px 14px;margin:7px 0;text-align:left;width:100%;font-size:13px}.alert.danger{border-left:4px solid var(--red);background:#fffafa}.alert.warn{border-left:4px solid #c7a24b;background:#fffdf7}.alert span:last-child{font-size:20px;color:#aaa}.next{margin-top:22px}.nextbox{background:var(--olive2);border:1px solid #d6dccf;border-radius:20px;padding:15px}.nextbox .over{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#70766a;font-weight:850}.nextbox h2{font-size:19px;margin:5px 0}.nextbox p{font-size:12px;color:#666b63;margin:4px 0}.next-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:43px;font-weight:800;font-size:11px}.btn.main{background:var(--olive);color:#fff;border-color:var(--olive)}.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.jobs{margin-top:22px}.job{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:9px 0;box-shadow:0 8px 25px #0000000a}.jobhead{display:flex;justify-content:space-between;gap:10px}.client{font-size:16px;font-weight:850}.time{font-size:11px;color:var(--muted);margin-top:3px}.price{font-size:18px;font-weight:850;white-space:nowrap}.address{font-size:11px;line-height:1.4;margin-top:10px}.note{font-size:11px;color:#666b63;margin-top:7px;line-height:1.35}.pill{display:inline-flex;background:var(--olive2);color:#59634f;border-radius:8px;padding:5px 8px;font-size:9px;font-weight:850;margin-top:9px}.jobbuttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:11px}.jobbuttons .btn{min-height:44px}.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.mini .btn{min-height:34px;padding:0 10px}.days{margin-top:22px}.dayrow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin:7px 0}.dayrow .d{font-weight:850}.dayrow small{color:var(--muted)}.bottom{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:64px;background:#fff;border:1px solid var(--line);border-radius:21px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 12px 32px #0002;padding:5px}.nav{border:0;background:none;border-radius:15px;font-size:9px;color:#858980}.nav b{display:block;font-size:16px;margin-bottom:2px}.nav.active{background:var(--olive2);color:#4e5947;font-weight:850}.fab{position:fixed;z-index:11;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:57px;height:57px;border:0;border-radius:18px;background:var(--olive);color:#fff;font-size:30px;box-shadow:0 12px 25px #0003}.sheet{position:fixed;z-index:30;inset:0;background:#0007;display:none;align-items:flex-end}.sheet.open{display:flex}.sheet>div{width:100%;max-width:600px;margin:auto;background:#fafaf7;border-radius:27px 27px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.handle{width:38px;height:4px;background:#ccc;border-radius:5px;margin:0 auto 17px}.sheet h2{margin:0 0 15px;font-size:24px}.field{margin:10px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:10px;font:inherit;font-size:15px}.reason{background:var(--red2);border-radius:14px;padding:12px;margin:12px 0;font-size:12px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.toast{position:fixed;z-index:50;left:14px;right:14px;top:calc(14px + env(safe-area-inset-top));padding:13px;background:#171916;color:#fff;border-radius:14px;display:none;font-size:12px}.toast.show{display:block}@media(min-width:601px){.bottom{left:calc(50% - 290px);right:calc(50% - 290px)}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">МОНТАЖИ <span style="color:#a5a9a1">AA</span></div><div class="date" id=date></div></div><div class=sync>● ОБЩАЯ БАЗА</div></header><section class=hello><h1>Рабочий день</h1><p id=greeting>Загрузка данных…</p></section><section class=money><div class=cap>Сегодня · чистыми</div><div class=num id=net>—</div><div class=sub><span>Доход<b id=income>—</b></span><span>Расход<b id=expense>—</b></span><span>Долги<b id=debt>—</b></span></div></section><section class=queue><div class=label>Требует внимания</div><div id=alerts></div></section><section class=next><div class=label>Следующее действие</div><div class=nextbox id=next>Загрузка…</div></section><section class=jobs><div class=label>Сегодня · выезды</div><div id=jobs></div></section><section class=days><div class=label>Дальше</div><div id=days></div></section></main><button class=fab id=add>＋</button><nav class=bottom><button class="nav active"><b>⌂</b>Сегодня</button><button class=nav><b>▦</b>График</button><button class=nav><b>₽</b>Деньги</button><button class=nav><b>♙</b>Клиенты</button><button class=nav><b>•••</b>Ещё</button></nav><div class=sheet id=sheet><div><div class=handle></div><h2 id=sheetTitle>Важно</h2><div id=sheetBody></div><div class=sheet-actions><button class=btn id=close>Закрыть</button><button class="btn main" id=sheetAction>Открыть</button></div></div></div><div class=toast id=toast></div><script type=module>
import {firebaseConfig} from './firebase-config.js';
const V='10.14.1';const fmt=n=>new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0))+' ₽';const dateKey=d=>{let x=new Date(d);return x.toISOString().slice(0,10)};const today=dateKey(new Date());const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
let F,auth,db,state={jobs:[],expenses:[]};
async function init(){const [a,au,fs]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);const app=a.initializeApp(firebaseConfig,'montaji-v5');auth=au.getAuth(app);db=fs.getFirestore(app);F={...fs,au};F.au.onAuthStateChanged(auth,u=>{if(!u){document.getElementById('greeting').textContent='Войдите через основное приложение';return}load()})}
async function load(){try{let s=await F.getDocFromServer(F.doc(db,'appData','shared'));if(!s.exists()){toast('Общая база пуста');return}state=s.data().data||{jobs:[],expenses:[]};render()}catch(e){console.error(e);toast('База недоступна — данные не скрываем как «0»')}}
function done(j){return j.status==='Выполнен'}function cancelled(j){return j.status==='Отменён'}function income(j){return !cancelled(j)&&done(j)?Number(j.price||j.measurePrice||0):0}
function render(){let d=new Date();document.getElementById('date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(d);let jobs=state.jobs||[],exp=(state.expenses||[]).filter(e=>!e.cancelled&&e.date===today).reduce((s,e)=>s+Number(e.amount||0),0),td=jobs.filter(j=>j.date===today&&!cancelled(j)),doneToday=td.filter(done),inc=doneToday.reduce((s,j)=>s+income(j),0),deb=doneToday.filter(j=>j.paid===false).reduce((s,j)=>s+income(j),0);document.getElementById('net').textContent=fmt(inc-exp);document.getElementById('income').textContent=fmt(inc);document.getElementById('expense').textContent=fmt(exp);document.getElementById('debt').textContent=fmt(deb);document.getElementById('greeting').textContent=`${td.length} ${td.length===1?'выезд':'выезда'} сегодня · ${doneToday.length} выполнено`;
let late=jobs.filter(j=>!cancelled(j)&&!done(j)&&j.date<today);let tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);let tk=dateKey(tomorrow),tom=jobs.filter(j=>j.date===tk&&!cancelled(j));let arr=[];if(late.length)arr.push(`<button class="alert danger" data-kind=late><span>⚠️ ${late.length} просроченных выезд${late.length===1?'':'а'}<small style="display:block;color:#777;margin-top:3px">Нажмите — увидеть карточки и причину</small></span><span>›</span></button>`);if(deb)arr.push(`<button class="alert warn" data-kind=debt><span>💰 ${fmt(deb)} не оплачено<small style="display:block;color:#777;margin-top:3px">Открыть список долгов</small></span><span>›</span></button>`);if(tom.length)arr.push(`<button class="alert" data-kind=tom><span>✨ Завтра ${tom.length} ${tom.length===1?'выезд':'выезда'}<small style="display:block;color:#777;margin-top:3px">Посмотреть план и напоминания</small></span><span>›</span></button>`);document.getElementById('alerts').innerHTML=arr.join('')||'<div class=alert><span>✓ Ничего срочного</span></div>';
let active=td.filter(j=>!done(j)).sort((a,b)=>(a.time||a.slot||'').localeCompare(b.time||b.slot||''));let n=active[0];document.getElementById('next').innerHTML=n?`<div class=over>${n.status||'Запланирован'} · ${esc(n.time||({'1':'10:00–12:00','2':'14:00–16:00','3':'3-й слот'}[String(n.slot)]||''))}</div><h2>${esc(n.client||'Без клиента')} <span style="font-size:15px">${fmt(n.price)}</span></h2><p>📍 ${esc(n.address||'Адрес не указан')}</p><div class=next-actions><button class="btn main" data-job="${esc(n.id)}">Открыть выезд</button><button class="btn" onclick="location.href='tel:${esc(n.phone||'')}'">Позвонить</button></div>`:'<div class=over>Готово</div><h2>На сегодня активных выездов нет</h2><p>Можно спокойно закрыть день.</p>';
document.getElementById('jobs').innerHTML=td.sort((a,b)=>String(a.slot||'').localeCompare(String(b.slot||''))).map(j=>`<article class=job><div class=jobhead><div><div class=client>${esc(j.client||'Без клиента')}</div><div class=time>${esc(j.time||({'1':'10:00–12:00','2':'14:00–16:00','3':'3-й слот'}[String(j.slot)]||''))} · ${esc(j.type||'Монтаж')}</div></div><div class=price>${fmt(j.price||j.measurePrice)}</div></div><div class=address>${j.address?'📍 '+esc(j.address):'📍 Адрес не указан'}</div>${j.comment?`<div class=note>${esc(j.comment)}</div>`:''}<div class=pill>${esc(j.status||'Запланирован')}${j.paid===false?' · долг':''}</div><div class=mini><button class=btn data-job="${esc(j.id)}">Открыть</button><button class=btn onclick="location.href='tel:${esc(j.phone||'')}'">Позвонить</button></div>${!done(j)&&!cancelled(j)?`<div class=jobbuttons><button class=btn data-status="В пути" data-id="${esc(j.id)}">В путь</button><button class="btn main" data-status="Выполнен" data-id="${esc(j.id)}">Выполнено</button><button class=btn data-status="Выполнен" data-paid=true data-id="${esc(j.id)}">Оплачено</button></div>`:''}</article>`).join('')||'<div class=alert>На сегодня выездов нет.</div>';
let dates=[...new Set(jobs.filter(j=>j.date>today&&!cancelled(j)).map(j=>j.date))].sort().slice(0,5);document.getElementById('days').innerHTML=dates.map(x=>{let js=jobs.filter(j=>j.date===x&&!cancelled(j));return`<div class=dayrow><div><div class=d>${new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'short'}).format(new Date(x+'T12:00:00'))}</div><small>${js.map(j=>esc(j.client||'Без клиента')).slice(0,2).join(' · ')}</small></div><small>${js.length} · ${fmt(js.reduce((s,j)=>s+Number(j.price||0),0))}</small></div>`}).join('')||'<div class=alert>Дальше пока пусто.</div>';
}
function open(kind){let jobs=state.jobs||[],body='',title='';if(kind==='late'){let x=jobs.filter(j=>!cancelled(j)&&!done(j)&&j.date<today);title='Просроченные выезды';body=x.map(j=>`<div class=job><b>${esc(j.client||'Без клиента')}</b><div class=time>${esc(j.date)} · ${esc(j.time||j.slot||'')}</div><div class=address>${esc(j.address||'Адрес не указан')}</div><div class=reason>Причина: ${j.cancelReason?esc(j.cancelReason):'Причина не указана'}<br><br>Следующий выезд: ${j.nextVisitDate?esc(j.nextVisitDate):'не назначен'}</div><button class="btn main" style="width:100%" data-job="${esc(j.id)}">Открыть карточку</button></div>`).join('')||'<p>Нет просроченных выездов.</p>'}else if(kind==='tom'){let x=jobs.filter(j=>j.date===tk&&!cancelled(j));title='Завтра';body=x.map(j=>`<div class=job><b>${esc(j.client||'Без клиента')}</b><div class=time>${esc(j.time||j.slot||'')}</div><div class=address>${esc(j.address||'Адрес не указан')}</div><div class=note>${j.comment?esc(j.comment):'Без комментария'}</div></div>`).join('')}else{let x=jobs.filter(j=>done(j)&&j.paid===false);title='Долги';body=x.map(j=>`<div class=job><b>${esc(j.client||'Без клиента')}</b><div class=price>${fmt(income(j))}</div><div class=time>${esc(j.date)}</div></div>`).join('')||'<p>Долгов нет.</p>'}document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;document.getElementById('sheet').classList.add('open')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
document.addEventListener('click',e=>{let a=e.target.closest('[data-kind]');if(a)open(a.dataset.kind);let j=e.target.closest('[data-job]');if(j)toast('Карточка выезда: '+j.dataset.job);let s=e.target.closest('[data-status]');if(s)toast('В песочнице действие готово к подключению к общей бизнес-логике');});document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('open');document.getElementById('add').onclick=()=>toast('Новый выезд — следующим шагом подключаем к форме основной логики');init();
</script></body></html>
