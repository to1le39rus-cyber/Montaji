<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montaji · Firebase probe</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;background:#f5f5f0;color:#222}button{padding:14px 18px;border:0;border-radius:12px;font-size:16px}pre{white-space:pre-wrap;background:#fff;padding:16px;border-radius:12px;margin-top:16px}strong{display:block;margin-bottom:8px}</style></head>
<body><h1>Firebase probe</h1><p>Проверяет текущую Firebase-сессию и чтение <code>/appData/shared</code>. Ничего не записывает.</p><button id="run">Проверить</button><pre id="out">Готов.</pre>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const V='10.14.1'; const out=document.querySelector('#out'); const log=x=>out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
async function run(){
  log('1/4 Загружаю Firebase…');
  try{
    const [A,AU,FS]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
    ]);
    const app=A.initializeApp(firebaseConfig,'montaji-debug'); const auth=AU.getAuth(app); const db=FS.getFirestore(app);
    const user=auth.currentUser;
    if(!user){log('2/4 НЕТ АКТИВНОЙ СЕССИИ\n\nОткрой сначала основное приложение на этом же домене, войди и затем снова открой эту страницу.');return;}
    log(`2/4 Пользователь найден\nemail: ${user.email}\nuid: ${user.uid}\n\n3/4 Обновляю Firebase ID token…`);
    const token=await user.getIdToken(true); const claims=await user.getIdTokenResult();
    log(`3/4 Token OK\nemail claim: ${claims.claims.email||'(нет)'}\nexpires: ${claims.expirationTime}\n\n4/4 Читаю /appData/shared…`);
    const snap=await FS.getDoc(FS.doc(db,'appData','shared'));
    log(`SUCCESS\nexists: ${snap.exists()}\npath: ${snap.ref.path}\nprojectId: ${firebaseConfig.projectId}\n\n${snap.exists()?'Документ прочитан. Размер data: '+JSON.stringify(snap.data()?.data||{}).length+' символов.':'Документ существует в Firebase, но пуст/не создан.'}`);
  }catch(e){
    console.error(e);
    log(`FAIL\nname: ${e?.name||'(нет)'}\ncode: ${e?.code||'(нет)'}\nmessage: ${e?.message||String(e)}\n\nПолный объект:\n${JSON.stringify({name:e?.name,code:e?.code,message:e?.message,stack:e?.stack},null,2)}`);
  }
}
document.querySelector('#run').onclick=run;
</script></body></html>
