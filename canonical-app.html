<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MONTRA — рабочее пространство</title>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/today.css">
<link rel="stylesheet" href="./src/styles/schedule.css">
<link rel="stylesheet" href="./src/styles/money.css">
<link rel="stylesheet" href="./src/styles/clients.css">
<link rel="stylesheet" href="./src/styles/notes-more.css">
<link rel="stylesheet" href="./src/styles/job-components.css">
<link rel="stylesheet" href="./src/styles/carousel.css">
<link rel="stylesheet" href="./src/styles/motion.css">
<link rel="stylesheet" href="./src/styles/auth.css">
<style>
body{background:#f6f7f5;color:#171914}.status,.warning{max-width:900px;margin:12px auto;padding:10px 12px;font-size:13px}.warning{border-radius:12px;background:#fff4d6;color:#6b5314}
</style>
</head>
<body>
<section id="gate" class="gate" hidden>
 <div class="auth-ambient" aria-hidden="true"></div>
 <main class="auth-card">
  <header class="auth-brand">
   <span class="auth-mark montra-mark" aria-hidden="true">
    <svg viewBox="0 0 48 48"><path d="M9 38V10h11l4 4 4-4h11v28M9 10l15 7 15-7M24 17v21"/></svg>
   </span>
   <span class="auth-wordmark"><strong>MONTRA</strong><b>ПАРТНЁРСТВО В РАБОТЕ</b></span>
  </header>
  <div class="auth-copy">
   <span class="auth-eyebrow">Рабочее пространство</span>
   <h1>С возвращением</h1>
   <p>Ваши заявки, клиенты и финансы — в одном месте.</p>
  </div>
  <form class="auth-form" id="loginForm">
   <label class="auth-field">
    <span>Электронная почта</span>
    <span class="auth-control">
     <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5h16v11H4zM4.5 7l7.5 6 7.5-6"/></svg>
     <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="name@example.ru" required>
    </span>
   </label>
   <label class="auth-field">
    <span>Пароль</span>
    <span class="auth-control">
     <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10M5 10h14v10H5z"/></svg>
     <input id="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required>
     <button class="auth-reveal" id="revealPassword" type="button" aria-label="Показать пароль"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
    </span>
   </label>
   <div id="error" class="error" role="alert" aria-live="polite"></div>
   <button id="login" class="auth-submit" type="submit"><span>Войти в приложение</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg></button>
  </form>
  <footer class="auth-trust"><i aria-hidden="true"></i><span>Защищённое подключение</span></footer>
 </main>
</section>
<div id="app"></div>
<script type="module">
import {createFirebase} from './src/data/firebase.js';
import {createSharedRepository} from './src/data/shared-repository.js';
import {createNotesRepository} from './src/data/notes-repository.js';
import {createJobRepository} from './src/data/job-repository.js';
import {createJobService} from './src/domain/job-service.js';
import {createStoreRepository} from './src/data/store-repository.js';
import {createStoreService} from './src/domain/store-service.js';
import {createNoteService} from './src/domain/note-service.js';
import {createExpenseService} from './src/domain/expense-service.js';
import {normalizeShared,normalizeNotes} from './src/domain/normalize.js';
import {createCanonicalShell} from './src/core/canonical-shell.js';
import {loadLocalSnapshot,saveLocalSnapshot,clearLocalCache} from './src/data/local-cache.js';
import {firebaseConfig} from './firebase-config.js';
import {createLaunchScreen} from './src/components/launch-screen.js';
const gate=document.querySelector('#gate'),app=document.querySelector('#app'),error=document.querySelector('#error'),email=document.querySelector('#email'),password=document.querySelector('#password'),loginForm=document.querySelector('#loginForm'),loginButton=document.querySelector('#login'),revealPassword=document.querySelector('#revealPassword');
const launch=createLaunchScreen();
const fb=createFirebase(firebaseConfig),shared=createSharedRepository({firestore:fb.firestore,...fb.firestoreApi}),notes=createNotesRepository({firestore:fb.firestore,...fb.firestoreApi});
let shell=null,unsubShared=null,unsubNotes=null,uid='';
const showError=e=>{error.textContent=e?.message||String(e)};
const stop=()=>{unsubShared?.();unsubNotes?.();unsubShared=null;unsubNotes=null};
async function resetCache(){if(!confirm('Очистить только локальные данные и кэш? Firestore не изменится.'))return;await clearLocalCache();location.reload()}
async function open(user){
 if(uid===user.uid)return;uid=user.uid;stop();gate.hidden=true;
 const cached=await loadLocalSnapshot(user.uid);
 const jobRepository=createJobRepository({firestore:fb.firestore,...fb.firestoreApi,actorId:user.uid});
 const jobService=createJobService({repository:jobRepository});
 const storeRepository=createStoreRepository({firestore:fb.firestore,...fb.firestoreApi,actorId:user.uid});
 const storeService=createStoreService({repository:storeRepository});
 const actions={clearCache:resetCache,signOut:()=>fb.authApi.signOut(fb.auth)};
 const noteService=createNoteService({repository:notes,actor:user});
 const expenseService=createExpenseService({repository:shared});
 if(cached){
  shell=createCanonicalShell({root:app,initialState:normalizeShared(cached.shared),initialNotes:normalizeNotes({notes:cached.notes}),user,readOnly:false,jobService,storeService,noteService,expenseService,actions});
  shell.state.setDataStatus('cache');shell.setCacheStatus('cached');
 }
 try{
  const raw=await Promise.race([shared.load(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Firestore connection timeout')),8000))]);
  const state=normalizeShared(raw);
  let ns=[];try{ns=normalizeNotes({notes:await notes.load()})}catch(e){console.warn(e);ns=cached?.notes?normalizeNotes({notes:cached.notes}):[]}
  if(!shell){
   shell=createCanonicalShell({root:app,initialState:state,initialNotes:ns,user,readOnly:false,jobService,storeService,noteService,expenseService,actions});
  }else{
   shell.state.setState(state);shell.state.setNotes(ns);
  }
  shell.state.setDataStatus('ready');shell.setCacheStatus(cached?'cached':'none');
  await saveLocalSnapshot({userId:user.uid,shared:state,notes:ns});
 }catch(e){
  console.warn('Firestore startup fallback',e);
  if(shell){
   shell.state.setDataStatus('offline');
  }else{
   showError(new Error('Не удалось подключиться к базе. Попробуйте войти ещё раз.'));gate.hidden=false;uid='';return;
  }
 }
 unsubShared=shared.subscribe((raw,meta={})=>{if(!shell)return;const s=normalizeShared(raw);shell.state.setState(s);const freshness=meta.hasPendingWrites?'pending':meta.fromCache?'cache':'ready';shell.state.setDataStatus(freshness);shell.setCacheStatus('cached');saveLocalSnapshot({userId:user.uid,shared:s,notes:shell.state.snapshot.notes});shell.router.render(shell.router.current||'today')},showError);
 unsubNotes=notes.subscribe(raw=>{if(!shell)return;const ns=normalizeNotes({notes:raw});shell.state.setNotes(ns);saveLocalSnapshot({userId:user.uid,shared:shell.state.snapshot.state,notes:ns});if(shell.router.current==='notes')shell.router.render('notes')},e=>console.warn('Notes realtime skipped',e));
}
revealPassword.onclick=()=>{const revealing=password.type==='password';password.type=revealing?'text':'password';revealPassword.setAttribute('aria-label',revealing?'Скрыть пароль':'Показать пароль');revealPassword.classList.toggle('is-active',revealing)};
loginForm.onsubmit=async event=>{event.preventDefault();error.textContent='';loginButton.disabled=true;loginButton.classList.add('is-loading');try{const credential=await fb.authApi.signInWithEmailAndPassword(fb.auth,email.value.trim(),password.value);if(credential?.user)await open(credential.user)}catch(e){showError(e)}finally{loginButton.disabled=false;loginButton.classList.remove('is-loading')}};
fb.authApi.onAuthStateChanged(fb.auth,async user=>{if(user){launch.dismiss();open(user)}else{stop();uid='';shell=null;app.innerHTML='';await launch.ready;gate.hidden=false;email.focus({preventScroll:true})}},showError);
</script>
</body>
</html>
