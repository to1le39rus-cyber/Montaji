<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Монтажи АА — DEV</title>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/today.css">
<link rel="stylesheet" href="./src/styles/schedule.css">
<link rel="stylesheet" href="./src/styles/money.css">
<link rel="stylesheet" href="./src/styles/clients.css">
<link rel="stylesheet" href="./src/styles/notes-more.css">
<link rel="stylesheet" href="./src/styles/job-components.css">
<link rel="stylesheet" href="./src/styles/carousel.css">
<link rel="stylesheet" href="./src/styles/motion.css">
<style>
.dev-boot{max-width:720px;margin:20px auto;padding:16px;font:15px system-ui;color:#171914}
.dev-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f0e5;font-weight:700}
.dev-boot p{line-height:1.45;color:#73776d}
</style>
</head>
<body>
<section id="boot" class="dev-boot"><span class="dev-badge">DEV · Firebase отключён</span><p>Загружаю безопасные демонстрационные данные…</p></section>
<div id="app"></div>
<script type="module">
import {createCanonicalShell} from './src/core/canonical-shell.js';
import {normalizeShared,normalizeNotes} from './src/domain/normalize.js';
import {createJobService} from './src/domain/job-service.js';
import {createStoreService} from './src/domain/store-service.js';
import {createNoteService} from './src/domain/note-service.js';
import {createExpenseService} from './src/domain/expense-service.js';
import {createDevJobRepository,createDevStoreRepository,createDevNotesRepository,createDevExpenseRepository} from './src/data/dev-repository.js';
import {loadFixture} from './src/data/fixture.js';
import {localISO,addDays,dateObject} from './src/ui/format.js';
import {createPartnerRequestService} from './src/services/partner-request-service.js';
import {partnerFixture} from './src/partner/partner-fixture.js';

const boot=document.querySelector('#boot');
const root=document.querySelector('#app');

async function start(){
 try{
  const fixture=await loadFixture('./montaji-fixture.json');
  // Keep the authored demo day useful whenever the preview is opened.
  const today=localISO();
  const shift=Math.round((dateObject(today)-dateObject('2026-09-20'))/86400000);
  const shiftDate=date=>date?addDays(date,shift):date;
  const shared=normalizeShared({...fixture.shared,jobs:fixture.shared.jobs.map(job=>({...job,date:shiftDate(job.date),completedDate:shiftDate(job.completedDate)})),expenses:fixture.shared.expenses.map(expense=>({...expense,date:shiftDate(expense.date)}))});
  const notes=normalizeNotes({notes:fixture.notes.map(note=>({...note,dueDate:shiftDate(note.dueDate)}))});
  const devState={jobs:[...shared.jobs],expenses:[...shared.expenses],stores:[...(shared.stores||[])],version:shared.version};
  const jobService=createJobService({repository:createDevJobRepository({state:devState})});
  const storeService=createStoreService({repository:createDevStoreRepository({state:devState})});
  const noteState={notes};
  const noteService=createNoteService({repository:createDevNotesRepository({state:noteState}),actor:{uid:'pages-dev',displayName:'DEV'}});
  const expenseService=createExpenseService({repository:createDevExpenseRepository({state:devState})});
  const partnerRequests=partnerFixture.orders.map(order=>({...order,organizationName:partnerFixture.organization.name,managerName:partnerFixture.team.find(member=>member.id===order.managerId)?.name||''}));
  const partnerRequestService=createPartnerRequestService({initial:partnerRequests});
  boot.remove();
  createCanonicalShell({
   root,
   initialState:devState,
   initialNotes:notes,
   user:{email:'dev@local',uid:'pages-dev'},
   readOnly:false,
   jobService,
   storeService,
   noteService,
   expenseService,
   partnerRequestService,
   today,
   demo:true,
   initialRoute:new URLSearchParams(location.search).get('screen')||'today',
   actions:{}
  });
 }catch(e){
  boot.innerHTML='<span class="dev-badge">DEV · Firebase отключён</span><p>Не удалось загрузить demo snapshot: '+String(e?.message||e).replace(/[<>]/g,'')+'</p>';
 }
}
start();
</script>
</body>
</html>
