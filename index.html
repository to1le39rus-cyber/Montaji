<!doctype html><html lang="ru"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#66704a" /><meta name="description" content="ASTERA — управление монтажами" /><link rel="manifest" href="manifest.json" /><link rel="icon" href="icon.svg" /><link rel="stylesheet" href="styles.css" /><title>ASTERA Монтажи</title></head><body><div class="app" id="app"><header class="topbar"><div><div class="brand">ASTERA</div><div class="top-date" id="topDate"></div></div><button class="circle-btn" id="themeBtn" aria-label="Тема">◐</button></header><main class="main"><section class="screen active" id="todayScreen"><div class="hero-card"><div class="hero-row"><span>Сегодня</span><span id="todayLoad"></span></div><div class="hero-income" id="todayIncome">0 ₽</div><div class="hero-label">запланировано</div><div class="progress"><span id="todayProgress"></span></div></div><div class="section-head"><h2>Выезды</h2><button class="text-btn" id="todayJump">Сегодня</button></div><div id="todayList" class="job-list"></div><div class="section-head upcoming-head"><h2>Ближайшие дни</h2></div><div id="upcomingList" class="upcoming-list"></div></section><section class="screen" id="scheduleScreen"><div class="screen-head"><div><div class="eyebrow">График</div><h1 id="scheduleMonth"></h1></div><div class="month-nav"><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div><div class="weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div id="calendar" class="calendar"></div><div class="legend"><span><i class="free"></i>свободно</span><span><i class="partial"></i>1–2</span><span><i class="busy"></i>3</span><span><i class="full"></i>макс.</span></div></section><section class="screen" id="moneyScreen"><div class="screen-head"><div><div class="eyebrow">Финансы</div><h1>Заработок</h1></div></div><div class="period-tabs" id="periodTabs"><button data-period="day">День</button><button data-period="week">Неделя</button><button class="selected" data-period="month">Месяц</button><button data-period="all">Всё</button></div><div class="money-total"><div class="money-value" id="moneyTotal">0 ₽</div><div class="muted" id="moneySub">—</div></div><div class="money-grid" id="moneyGrid"></div><div class="chart-card"><div class="section-head"><h2>Динамика</h2><span class="muted" id="chartCaption"></span></div><div id="chart" class="chart"></div></div><div class="chart-card"><div class="section-head"><h2>По магазинам</h2></div><div id="storeBreakdown"></div></div></section><section class="screen" id="clientsScreen"><div class="screen-head"><div><div class="eyebrow">База</div><h1>Клиенты</h1></div></div><input id="clientSearch" class="search" type="search" placeholder="Поиск клиента, телефона, адреса" /><div id="clientsList" class="client-list"></div></section><section class="screen" id="moreScreen"><div class="screen-head"><div><div class="eyebrow">Система</div><h1>Ещё</h1></div></div><div class="settings-card"><button class="setting-row" id="backupBtn"><span>Резервная копия</span><b>Экспорт JSON ›</b></button><label class="setting-row"><span>Восстановить данные</span><b>Выбрать файл ›</b><input id="restoreInput" type="file" accept="application/json" hidden /></label><button class="setting-row" id="clearDemoBtn"><span>Демо-данные</span><b>Сбросить ›</b></button></div><div class="system-note" id="syncStatus">Локальный режим · данные сохраняются мгновенно</div></section></main><button class="fab" id="addBtn" aria-label="Добавить">+</button><nav class="bottom-nav"><button class="nav active" data-screen="todayScreen"><span>⌂</span><small>Сегодня</small></button><button class="nav" data-screen="scheduleScreen"><span>▦</span><small>График</small></button><button class="nav" data-screen="moneyScreen"><span>₽</span><small>Деньги</small></button><button class="nav" data-screen="clientsScreen"><span>◯</span><small>Клиенты</small></button><button class="nav" data-screen="moreScreen"><span>•••</span><small>Ещё</small></button></nav></div><div class="modal" id="jobModal" aria-hidden="true"><div class="backdrop" data-close="jobModal"></div><div class="sheet"><div class="handle"></div><div class="sheet-head"><div><div class="eyebrow">Выезд</div><h2 id="modalTitle">Новый монтаж</h2></div><button class="circle-btn" data-close="jobModal">×</button></div><form id="jobForm"><input id="jobId" type="hidden" /><div class="type-tabs" id="typeTabs"><button type="button" data-type="Монтаж" class="selected">Монтаж</button><button type="button" data-type="Замер">Замер</button><button type="button" data-type="Рекламация">Рекламация</button><button type="button" data-type="Доставка">Доставка</button><button type="button" data-type="Сервис">Сервис</button></div><div class="form-row"><label>Дата<input id="jobDate" type="date" required /></label><label>Время<select id="jobSlot"><option value="1">10:00–12:00</option><option value="2">14:00–16:00</option><option value="3">3-й слот / резерв</option></select></label></div><label>Клиент<input id="jobClient" required placeholder="ФИО / компания" /></label><div class="form-row"><label>Телефон<input id="jobPhone" type="tel" placeholder="8 900..." /></label><label>Сумма<input id="jobPrice" type="number" min="0" step="100" placeholder="0" /></label></div><label>Адрес<textarea id="jobAddress" rows="2" placeholder="Адрес объекта"></textarea></label><div class="form-row"><label>Магазин<input id="jobStore" placeholder="ASTERA / LAVETRA DOORS" /></label><label>Статус<select id="jobStatus"><option>Запланирован</option><option>Подтверждён</option><option>В пути</option><option>На объекте</option><option>Выполнен</option><option>Перенос</option><option>Отменён</option></select></label></div><label>Комментарий<textarea id="jobComment" rows="3" placeholder="Дверь, доборы, особенности, контакты..."></textarea></label><div id="slotWarning" class="warning hidden"></div><div class="form-actions"><button class="primary" type="submit">Сохранить</button><button class="danger ghost" type="button" id="deleteBtn">Удалить</button></div></form></div></div><script type="module" src="app-v3.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
