<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Монтажи АА — Canonical Live Preview</title>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/today.css">
<link rel="stylesheet" href="./src/styles/schedule.css">
<link rel="stylesheet" href="./src/styles/money.css">
<link rel="stylesheet" href="./src/styles/clients.css">
<link rel="stylesheet" href="./src/styles/notes-more.css">
<link rel="stylesheet" href="./src/styles/job-components.css">
<link rel="stylesheet" href="./src/styles/carousel.css">
<link rel="stylesheet" href="./src/styles/motion.css">
<style>
body{background:#f6f7f5;color:#171914}.live-gate{max-width:560px;margin:8vh auto;padding:24px;border:1px solid #ddd;border-radius:24px;background:#fff}.live-gate h1{margin:0 0 8px}.live-gate p{color:#666}.live-gate label{display:grid;gap:7px;margin:14px 0}.live-gate input{padding:13px;border:1px solid #ccc;border-radius:12px}.live-gate button{padding:13px 16px;border:0;border-radius:12px;background:#2f6fed;color:#fff;font-weight:700}.live-error{margin-top:12px;color:#a33}.live-badge{max-width:900px;margin:12px auto;padding:8px 12px;color:#555;font-size:13px}
</style>
</head>
<body>
<section id="gate" class="live-gate">
<h1>Canonical Live Preview</h1>
<p>Canonical Live. Здесь новый runtime читает текущую общую базу Montaji. Режим чтения. Запись здесь отключена.</p>
<label>Email<input id="email" type="email" autocomplete="username"></label>
<label>Пароль<input id="password" type="password" autocomplete="current-password"></label>
<button id="login" type="button">Войти</button>
<div id="error" class="live-error"></div>
</section>
<div id="status" class="live-badge" hidden></div>
<div id="app"></div>
<script type="module">
import { createFirebase } from './src/data/firebase.js';
import { createSharedRepository } from './src/data/shared-repository.js';
import { createNotesRepository } from './src/data/notes-repository.js';
import { normalizeShared, normalizeNotes } from './src/domain/normalize.js';
import { createCanonicalShell } from './src/core/canonical-shell.js';
import { loadLocalSnapshot, saveLocalSnapshot, clearLocalCache } from './src/data/local-cache.js';
import { firebaseConfig } from './firebase-config.js';
const gate=document.querySelector('#gate'), appRoot=document.querySelector('#app'), status=document.querySelector('#status'), error=document.querySelector('#error');
const email=document.querySelector('#email'), password=document.querySelector('#password');
const fb=createFirebase(firebaseConfig);
const shared=createSharedRepository({firestore:fb.firestore,...fb.firestoreApi});
const notes=createNotesRepository({firestore:fb.firestore,...fb.firestoreApi});
let shell=null, sharedUnsub=null, notesUnsub=null, openedUid='';
function showError(e){error.textContent=e?.message||String(e)}
function stopRealtime(){sharedUnsub?.();notesUnsub?.();sharedUnsub=null;notesUnsub=null}
async function resetLocalCache(){
 if(!window.confirm('Очистить только локальные данные и кэш этого приложения? Firestore не изменится.'))return;
 status.textContent='Очищаем локальные данные…';
 await clearLocalCache();
 window.location.reload();
}
async function open(user){
 if(openedUid===user.uid)return;
 openedUid=user.uid; stopRealtime(); gate.hidden=true; status.hidden=false; error.textContent='';
 const cached=await loadLocalSnapshot(user.uid);
 if(cached){
  shell=createCanonicalShell({
   root:appRoot,
   initialState:normalizeShared(cached.shared),
   initialNotes:normalizeNotes({notes:cached.notes}),
   user,
   readOnly:true,
   actions:{clearCache:resetLocalCache,signOut:()=>fb.authApi.signOut(fb.auth)}
  });
  shell.state.setDataStatus('cache');
  shell.setCacheStatus('cached');
  status.textContent='● Локальный снимок · проверяем Firestore…';
 }
 try{
  const rawShared=await shared.load();
  const normalizedShared=normalizeShared(rawShared);
  let normalizedNotes=[];
  try{
   const rawNotes=await notes.load();
   normalizedNotes=normalizeNotes({notes:rawNotes});
  }catch(notesError){
   console.warn('Notes load skipped',notesError);
   normalizedNotes=cached?.notes?normalizeNotes({notes:cached.notes}):[];
  }
  if(!shell){
   shell=createCanonicalShell({
    root:appRoot,
    initialState:normalizedShared,
    initialNotes:normalizedNotes,
    user,
    readOnly:true,
    actions:{clearCache:resetLocalCache,signOut:()=>fb.authApi.signOut(fb.auth)}
   });
  }else{
   shell.state.setState(normalizedShared);
   shell.state.setNotes(normalizedNotes);
  }
  shell.state.setDataStatus('ready');
  shell.setCacheStatus('cached');
  await saveLocalSnapshot({userId:user.uid,shared:normalizedShared,notes:normalizedNotes});
  status.textContent='● Firestore · realtime · актуально';
 }catch(e){
  console.error(e);
  if(!shell){
   showError(e);gate.hidden=false;status.hidden=true;openedUid='';
   return;
  }
  shell.state.setDataStatus('offline');
  status.textContent='⚠️ Локальные данные · Firestore пока недоступен';
  showError(e);
 }
 sharedUnsub=shared.subscribe((raw,meta={})=>{
  const normalized=normalizeShared(raw);
  shell.state.setState(normalized);
  const freshness=meta.hasPendingWrites?'pending':meta.fromCache?'cache':'ready';
  shell.state.setDataStatus(freshness);
  shell.setCacheStatus('cached');
  saveLocalSnapshot({userId:user.uid,shared:normalized,notes:shell.state.snapshot.notes});
  shell.router.render(shell.router.current||'today');
  status.textContent=meta.hasPendingWrites?'◌ Изменения отправляются в Firestore…':meta.fromCache?'◌ Firestore · локальный snapshot · ждём сервер…':'● Firestore · realtime · сервер подтверждён';
 },showError);
 notesUnsub=notes.subscribe(raw=>{
  const normalized=normalizeNotes({notes:raw});
  shell.state.setNotes(normalized);
  saveLocalSnapshot({userId:user.uid,shared:shell.state.snapshot.state,notes:normalized});
  if(shell.router.current==='notes')shell.router.render('notes');
 },e=>console.warn('Notes realtime skipped',e));
}
document.querySelector('#login').addEventListener('click',async()=>{
 error.textContent='';
 try{await fb.authApi.signInWithEmailAndPassword(fb.auth,email.value.trim(),password.value)}catch(e){showError(e)}
});
fb.authApi.onAuthStateChanged(fb.auth,user=>{
 if(user)open(user);
 else{stopRealtime();openedUid='';shell=null;appRoot.innerHTML='';gate.hidden=false;status.hidden=true;}
},showError);
</script>
</body>
</html>
