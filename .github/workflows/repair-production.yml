name: One-time production repair

on:
  push:
    branches: ["Astera-smart"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore: finalize production architecture') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair production architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text()

          old = "function jobsForDate(d){return state.jobs.filter(j=>!isCancelled(j)&&j.date===d);} function activeJobs(d){return jobsForDate(d).filter(j=>!isDone(j));} function montageCount(d){return activeJobs(d).filter(j=>j.type==='Монтаж').length;} function freeSlot(d){const used=new Set(activeJobs(d).filter(j=>j.type==='Монтаж').map(j=>String(j.slot)));return ['1','2','3'].find(s=>!used.has(s))||'3';}"
          new = "function jobsForDate(d){return state.jobs.filter(j=>!isCancelled(j)&&j.date===d);} function activeJobs(d){return jobsForDate(d).filter(j=>!isDone(j));} function montageCount(d){return jobsForDate(d).filter(j=>j.type==='Монтаж').length;} function freeSlot(d){return '1';}"
          if old not in app:
              raise SystemExit('capacity source not found')
          app = app.replace(old, new, 1)

          old = "function checkSlot(){const d=$('#jobDate').value,s=$('#jobSlot').value,id=$('#jobId').value,conflict=editingType==='Монтаж'&&state.jobs.find(j=>j.id!==id&&!isCancelled(j)&&!isDone(j)&&j.type==='Монтаж'&&j.date===d&&String(j.slot)===s);const w=$('#slotWarning');w.classList.toggle('hidden',!conflict);if(conflict)w.textContent=`Слот занят: ${conflict.client}.`}"
          new = "function checkSlot(){const w=$('#slotWarning');w.classList.add('hidden');w.textContent='';}"
          if old not in app:
              raise SystemExit('checkSlot source not found')
          app = app.replace(old, new, 1)

          old = "if(editingType==='Монтаж'){const conflict=state.jobs.find(j=>j.id!==id&&!isCancelled(j)&&!isDone(j)&&j.type==='Монтаж'&&j.date===d&&String(j.slot)===$('#jobSlot').value);if(conflict)return toast(`Слот занят: ${conflict.client}`,'error')}"
          if old not in app:
              raise SystemExit('save conflict source not found')
          app = app.replace(old, "", 1)

          app = app.replace("$('#todayLoad').textContent=`${montageCount(d)}/3`;", "$('#todayLoad').textContent=String(montageCount(d));", 1)
          app = app.replace("$('#todayProgress').style.width=Math.min(100,montageCount(d)/3*100)+'%';", "$('#todayProgress').style.width=montageCount(d)>0?'100%':'0%';", 1)
          app = app.replace("if(tc===3)advice.push('🔥 Завтра 3/3 монтажей — день полностью загружен');else if(tc===2)advice.push('✨ Завтра осталось одно монтажное окно');", "if(tc>0)advice.push(`✨ Завтра запланировано ${tc} монтажей`);", 1)
          app = app.replace("<span>● 3/3</span>", "<span>● монтажи</span>", 1)
          app = app.replace("${c>=3?'full':c===2?'busy':c?'partial':''}", "${c>0?'busy':''}", 1)

          Path('app.js').write_text(app)

          boot = '''import './app.js?v=20260820-2';\n\nwindow.addEventListener('error', event => {\n  console.error('Montaji boot failed', event.error || event.message);\n  const el = document.querySelector('#syncStatus');\n  if (el) { el.textContent = 'Ошибка запуска'; el.dataset.state = 'offline'; }\n  const toast = document.querySelector('#toast');\n  if (toast) { toast.textContent = 'Не удалось запустить рабочее приложение.'; toast.dataset.state = 'error'; }\n});\n'''
          Path('boot.js').write_text(boot)

          index = Path('index.html').read_text()
          index = re.sub(r'boot\\.js\\?v=[^"\']+', 'boot.js?v=20260820-2', index)
          Path('index.html').write_text(index)

          readme = Path('README.md').read_text()
          readme = readme.replace('Firebase Anonymous Auth — прозрачное подключение рабочих устройств без отдельной формы входа.', 'Firebase Email/Password Auth — рабочие аккаунты с подтверждением email.')
          readme = readme.replace('загрузка 3 монтажных окон;', 'загрузка дня без искусственного лимита; слоты 1–3 — только пресеты времени;')
          readme = readme.replace('Максимальная ёмкость — 3 монтажных окна.', 'Лимита количества монтажей на дату нет. Слоты 1–3 — пресеты времени, а не ограничение количества выездов.')
          readme = readme.replace('3/3 capacity;', 'неограниченное количество монтажей на дату;')
          readme = readme.replace('Перед ручным live smoke-test необходимо дождаться зелёного Vercel deployment и открыть приложение в Safari/Chrome.', 'Перед ручным live smoke-test необходимо дождаться зелёного Firebase Hosting deployment и открыть production URL в Safari/Chrome.')
          Path('README.md').write_text(readme)

          team = Path('TEAM-OPERATING-SYSTEM.md').read_text()
          team = team.replace('Firebase `appData/shared` — source of truth;', 'Firebase `appData/shared` — source of truth;')
          Path('TEAM-OPERATING-SYSTEM.md').write_text(team)

          qa = Path('QA-MATRIX.md').read_text()
          qa = qa.replace('3/3', 'без лимита')
          qa = qa.replace('capacity', 'daily scheduling')
          Path('QA-MATRIX.md').write_text(qa)

          tests = Path('tests/final-architecture.test.mjs').read_text()
          tests = tests.replace("assert.match(boot, /There is deliberately NO daily capacity limit/);", "assert.match(app, /function montageCount\\(d\\)\\{return jobsForDate\\(d\\)\\.filter\\(j=>j\\.type==='Монтаж'\\)\\.length;\\}/);")
          tests = tests.replace("assert.match(boot, /conflict=null/);", "assert.match(app, /function checkSlot\\(\\)\\{const w=\\$\\('#slotWarning'\\);w\\.classList\\.add\\('hidden'\\)/);")
          tests = tests.replace("assert.doesNotMatch(boot, /Сегодня уже занято 3\\/3 монтажных окна/);", "assert.doesNotMatch(app, /Сегодня уже занято 3\\/3 монтажных окна/);")
          tests = tests.replace("assert.doesNotMatch(boot, /На эту дату уже занято 3\\/3 монтажных окна/);", "assert.doesNotMatch(app, /На эту дату уже занято 3\\/3 монтажных окна/);")
          tests = tests.replace("assert.match(boot, /CONFIG_URL/);\n  assert.match(boot, /firebase-config\\.js/);\n  assert.doesNotMatch(boot, /signInAnonymously/);", "assert.match(boot, /import ['\\\"]\\.\\/app\\.js\\?v=/);")
          Path('tests/final-architecture.test.mjs').write_text(tests)
          PY

      - name: Validate repaired source
        run: npm test

      - name: Commit repaired production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js boot.js index.html README.md TEAM-OPERATING-SYSTEM.md QA-MATRIX.md tests/final-architecture.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize production architecture"
          git push
