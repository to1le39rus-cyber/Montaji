name: One-time production architecture repair

on:
  push:
    branches: ["production-repair-20260820"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair canonical source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text()
          replacements = [
            ("function jobsForDate(d){return state.jobs.filter(j=>!isCancelled(j)&&j.date===d);} function activeJobs(d){return jobsForDate(d).filter(j=>!isDone(j));} function montageCount(d){return activeJobs(d).filter(j=>j.type==='Монтаж').length;} function freeSlot(d){const used=new Set(activeJobs(d).filter(j=>j.type==='Монтаж').map(j=>String(j.slot)));return ['1','2','3'].find(s=>!used.has(s))||'3';}",
             "function jobsForDate(d){return state.jobs.filter(j=>!isCancelled(j)&&j.date===d);} function activeJobs(d){return jobsForDate(d).filter(j=>!isDone(j));} function montageCount(d){return jobsForDate(d).filter(j=>j.type==='Монтаж').length;} function freeSlot(d){return '1';}"),
            ("$('#todayLoad').textContent=`${montageCount(d)}/3`;$('#todayProgress').style.width=Math.min(100,montageCount(d)/3*100)+'%';",
             "$('#todayLoad').textContent=String(montageCount(d));$('#todayProgress').style.width=montageCount(d)>0?'100%':'0%';"),
            ("if(tc===3)advice.push('🔥 Завтра 3/3 монтажей — день полностью загружен');else if(tc===2)advice.push('✨ Завтра осталось одно монтажное окно');",
             "if(tc>0)advice.push(`✨ Завтра запланировано ${tc} монтажей`);"),
            ("h+=`<button class=\"day ${c>=3?'full':c===2?'busy':c?'partial':''} ${hasMeasure?'has-measure':''} ${k===today()?'today':''}\" data-date=\"${k}\"><b>${n}</b><span>${js.length} выезд</span><i>${c}/3${hasMeasure?' · замер':''}</i></button>`;",
             "h+=`<button class=\"day ${c>0?'busy':''} ${hasMeasure?'has-measure':''} ${k===today()?'today':''}\" data-date=\"${k}\"><b>${n}</b><span>${js.length} выезд</span><i>${c} монтажей${hasMeasure?' · замер':''}</i></button>`;"),
            ("const d=$('#jobDate').value,s=$('#jobSlot').value,id=$('#jobId').value,conflict=editingType==='Монтаж'&&state.jobs.find(j=>j.id!==id&&!isCancelled(j)&&!isDone(j)&&j.type==='Монтаж'&&j.date===d&&String(j.slot)===s);",
             "const d=$('#jobDate').value,s=$('#jobSlot').value,id=$('#jobId').value,conflict=null;"),
            ("const conflict=state.jobs.find(j=>j.id!==id&&!isCancelled(j)&&!isDone(j)&&j.type==='Монтаж'&&j.date===d&&String(j.slot)===$('#jobSlot').value);",
             "const conflict=null;"),
            ("function checkSlot(){const d=$('#jobDate').value,s=$('#jobSlot').value,id=$('#jobId').value,conflict=null;const w=$('#slotWarning');w.classList.toggle('hidden',!conflict);if(conflict)w.textContent=`Слот занят: ${conflict.client}.`}",
             "function checkSlot(){const w=$('#slotWarning');w.classList.add('hidden');w.textContent='';}"),
            ("['1','2','3'].map(s=>{const j=pending.find(x=>x.type==='Монтаж'&&String(x.slot)===s);return`<div class=\"slot\"><div class=\"slot-title\">${SLOTS[s]}</div>${j?jobCard(j,{compact:true}):`<button class=\"free-slot\" data-slot=\"${s}\">＋ Свободное окно</button>`}</div>`}).join('')",
             "pending.filter(j=>j.type==='Монтаж').map(j=>jobCard(j,{compact:true})).join('')||'<div class=\"muted\">Монтажей нет</div>'"),
            ("(async()=>{try{bindUI();bindAuth();await initFirebase();F.authMod.onAuthStateChanged(auth,onUser)}catch(e){console.error(e);showAuth(true);authMessage('Не удалось запустить приложение. Проверьте Firebase.',true)}})();",
             "(async()=>{try{bindAuth();bindUI();await initFirebase();F.authMod.onAuthStateChanged(auth,onUser)}catch(e){console.error(e);showAuth(true);authMessage('Не удалось запустить приложение: '+(e?.message||'проверьте Firebase.'),true)}})();"),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('APP_PATCH_NOT_FOUND: '+old[:120])
              s=s.replace(old,new,1)
          app.write_text(s)

          index = Path('index.html')
          h = index.read_text()
          h = h.replace('<script type="module" src="boot.js?v=20260820-2"></script>', '<script type="module" src="app.js?v=20260820-5"></script>')
          h = h.replace('<button class="text-btn" id="signUpBtn" type="button">Регистрация</button>', '<button class="text-btn" id="signUpBtn" type="button" hidden>Регистрация</button>')
          if 'boot.js?v=' in h or 'secure-app' in h or 'raw.githubusercontent.com' in h:
              raise SystemExit('INDEX_STILL_REFERENCES_RUNTIME_LOADER')
          index.write_text(h)

          package = Path('package.json')
          p = package.read_text()
          p = p.replace('node --check app.js && node --check boot.js && node --test tests/final-architecture.test.mjs', 'node --check app.js && node --test tests/final-architecture.test.mjs')
          package.write_text(p)

          tests = Path('tests/final-architecture.test.mjs')
          tests.write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';

const index = fs.readFileSync('index.html', 'utf8');
const app = fs.readFileSync('app.js', 'utf8');
const css = fs.readFileSync('styles.css', 'utf8');
const ux = fs.readFileSync('ux-upgrades.css', 'utf8');
const rules = fs.readFileSync('firestore.rules', 'utf8');

test('production entry loads canonical local source directly', () => {
  assert.equal((index.match(/<script[^>]+type=["']module["']/g) || []).length, 1);
  assert.match(index, /app\.js\?v=/);
  assert.match(index, /styles\.css\?v=/);
  assert.match(index, /ux-upgrades\.css\?v=/);
  assert.doesNotMatch(index, /boot\.js|secure-app|raw\.githubusercontent\.com|document\.write/);
});

test('canonical application has no runtime source patching', () => {
  assert.doesNotMatch(app, /source\.replace|document\.write|raw\.githubusercontent\.com/);
  assert.doesNotMatch(index, /raw\.githubusercontent\.com|secure-app/);
});

test('working Firestore database contract is preserved', () => {
  assert.match(app, /const SHARED_DOC = \['appData', 'shared'\]/);
  assert.match(app, /const NOTES_DOC = \['appData', 'notes'\]/);
  assert.match(app, /getDocFromServer/);
  assert.match(app, /onSnapshot/);
  assert.match(app, /runTransaction/);
  assert.doesNotMatch(app, /localStorage|sessionStorage/);
});

test('auth binding is registered before UI binding', () => {
  assert.match(app, /bindAuth\(\);bindUI\(\);await initFirebase\(\)/);
  assert.match(app, /e\.preventDefault\(\)/);
});

test('montage scheduling is unlimited by business rule', () => {
  assert.match(app, /function montageCount\(d\).*jobsForDate\(d\).*type==='Монтаж'/s);
  assert.doesNotMatch(app, /conflict=state\.jobs\.find/);
  assert.doesNotMatch(app, /Слот занят/);
  assert.doesNotMatch(app, /\/3/);
  assert.match(index, /<span id="todayLoad">0<\/span> монтажей/);
});

test('day archive renders every montage instead of three slot buckets', () => {
  assert.match(app, /pending\.filter\(j=>j\.type==='Монтаж'\)\.map\(j=>jobCard/);
  assert.doesNotMatch(app, /\['1','2','3'\]\.map\(s=>/);
});

test('measure flow has all required DOM fields', () => {
  for (const id of ['timeWrap','measureWrap','measurePrice','measurePaid','measureCredit','convertMeasureBtn']) assert.match(index, new RegExp(`id="${id}"`));
  assert.match(index, /data-type="Замер"/);
  assert.match(app, /convertedFromMeasureId/);
  assert.match(app, /convertedToJobId/);
});

test('financial semantics distinguish completed income, expenses and debt', () => {
  assert.match(app, /function effectiveIncome/);
  assert.match(app, /j\.paid===false/);
  assert.match(app, /net:income-expenses/);
  assert.match(app, /data-open-debts/);
});

test('future jobs never become debt or income before completion', () => {
  assert.match(app, /if\(isCancelled\(j\)\|\|!isDone\(j\)\)return 0/);
  assert.match(app, /const debts=state\.jobs\.filter\(j=>!isCancelled\(j\)&&isDone\(j\)&&j\.paid===false\)/);
});

test('history is preserved instead of destructive deletion', () => {
  assert.match(app, /status:'Отменён'/);
  assert.match(app, /cancelledAt/);
  assert.doesNotMatch(app, /jobs:cur\.jobs\.filter\(j=>j\.id!==id\)/);
});

test('expenses are independent and archivable', () => {
  assert.match(app, /expenses: Array\.isArray/);
  assert.match(app, /cancelled:e\.cancelled === true/);
  assert.match(app, /cancelled:true/);
  assert.match(app, /id="cancelExpense"/);
});

test('money screen supports day, week, month and all-time totals', () => {
  assert.match(app, /totals\('day'\)/);
  assert.match(app, /totals\('week'\)/);
  assert.match(app, /totals\('month'\)/);
  assert.match(app, /totals\('all'\)/);
  assert.match(app, /Расходы — история/);
});

test('mobile UX protects the viewport', () => {
  assert.match(css, /overflow-x:hidden/);
  assert.match(index, /viewport-fit=cover/);
  assert.match(css, /env\(safe-area-inset-bottom\)/);
  assert.match(css, /max-width:100%/);
});

test('Firestore security requires authenticated verified users', () => {
  assert.match(rules, /request\.auth != null/);
  assert.match(rules, /request\.auth\.token\.email_verified == true/);
  assert.match(rules, /match \/appData\/shared/);
  assert.match(rules, /match \/appData\/notes/);
});

test('quick actions and daily workflow remain wired', () => {
  assert.match(app, /data-quick="route"/);
  assert.match(app, /data-quick="done"/);
  assert.match(app, /data-quick="paid"/);
  assert.match(app, /navigator\.share/);
  assert.match(index, /Расходы сегодня/);
  assert.match(index, /Архив заметок/);
  assert.match(index, /Ближайшие дни/);
});
''')

          Path('firestore.rules').write_text('''rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() {\n      return request.auth != null && request.auth.token.email_verified == true;\n    }\n\n    match /appData/shared {\n      allow read, write: if signedIn();\n    }\n\n    match /appData/notes {\n      allow read, write: if signedIn();\n    }\n  }\n}\n''')

          for path in ['boot.js', 'sync-recovery.js']:
              Path(path).unlink(missing_ok=True)
          secure = Path('secure-app')
          if secure.exists():
              for p in sorted(secure.rglob('*'), reverse=True):
                  if p.is_file(): p.unlink()
                  elif p.is_dir(): p.rmdir()
              secure.rmdir()
          PY

      - name: Validate source and tests
        run: npm test

      - name: Verify no legacy runtime loader remains
        run: |
          ! grep -R -n -E 'boot\.js|secure-app|raw\.githubusercontent\.com|document\.write|source\.replace' --exclude-dir=.git .
          ! grep -R -n -E '3/3|Слот занят|3-й слот / резерв.*занят' --exclude-dir=.git app.js index.html tests

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "OpenAI Production Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove runtime patching and enforce production invariants [skip ci]"
          git push origin HEAD:production-repair-20260820
