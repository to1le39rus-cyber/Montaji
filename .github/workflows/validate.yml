name: Validate Montaji AA production

on:
  push:
    branches: ["Astera-smart", "product-overhaul-20260819"]
  pull_request:
    branches: ["Astera-smart"]

permissions:
  contents: read

jobs:
  syntax-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Run production regression suite
        run: npm test

      - name: Check production wiring
        run: |
          grep -E 'boot\.js\?v=' index.html
          test "$(grep -o 'type=\"module\"' index.html | wc -l)" -eq 1
          test -f firebase-config.js
          test -f firestore.rules
          test -f firebase.json
          test -f .firebaserc

      - name: Check Russian map routing
        run: |
          grep -F 'yandex.ru/maps' app.js
          grep -F '2gis.ru/search' app.js
          ! grep -F 'google.com/maps' app.js

      - name: Check security rules
        run: |
          grep -F 'request.auth != null' firestore.rules
          grep -F 'match /appData/shared' firestore.rules
          grep -F 'match /appData/notes' firestore.rules

      - name: Check legacy production wiring
        run: |
          ! grep -E 'v9.js|v9-compat|app-v[0-9]|firebase-sync|archive.js|enhancement-v8.js' index.html
