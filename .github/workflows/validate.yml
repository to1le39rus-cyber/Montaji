name: Validate Montaji AA production

on:
  push:
    branches: ["Astera-smart", "product-overhaul-20260819"]
  pull_request:
    branches: ["Astera-smart"]

permissions:
  contents: write

jobs:
  syntax-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final notes architecture once
        if: github.ref == 'refs/heads/Astera-smart'
        run: |
          if grep -q 'data-note-done' app.js; then echo 'Migration already applied.'; exit 0; fi
          python3 scripts/final_notes_migration.py
          python3 - <<'PY'
from pathlib import Path
p=Path('tests/final-architecture.test.mjs')
s=p.read_text()
s=s.replace("assert.match(app, /getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.SHARED_DOC\\)\\)/);\n  assert.match(app, /getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.NOTES_DOC\\)\\)/);\n  assert.match(app, /Promise\\.all\\(\\[/);", "assert.match(app, /const sharedSnap=await F\\.getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.SHARED_DOC\\)\\)/);\n  assert.match(app, /const notesSnap=await F\\.getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.NOTES_DOC\\)\\)/);\n  assert.doesNotMatch(app, /const \\[sharedSnap,notesSnap\\]=await Promise\\.all/);")
p.write_text(s)
PY
          git config user.name 'montaji-bot'
          git config user.email 'montaji-bot@users.noreply.github.com'
          git add app.js tests/final-architecture.test.mjs
          git commit -m 'feat: finish notes workspace architecture'
          git push origin HEAD:Astera-smart
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production regression suite
        run: npm test
      - name: Check production wiring
        run: |
          grep -E 'boot\.js\?v=' index.html
          test "$(grep -o 'type=\"module\"' index.html | wc -l)" -eq 1
          test -f firebase-config.js
          test -f firestore.rules
          test -f firebase.json
          test -f .firebaserc
      - name: Check Russian map routing
        run: |
          grep -F 'yandex.ru/maps' app.js
          grep -F '2gis.ru/search' app.js
          ! grep -F 'google.com/maps' app.js
      - name: Check security rules
        run: |
          grep -F 'request.auth != null' firestore.rules
          grep -F 'match /appData/shared' firestore.rules
          grep -F 'match /appData/notes' firestore.rules
      - name: Check legacy production wiring
        run: |
          ! grep -E 'v9.js|v9-compat|app-v[0-9]|firebase-sync|archive.js|enhancement-v8.js' index.html
