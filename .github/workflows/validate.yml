name: Validate Montaji AA

on:
  push:
    branches: ["astera-v3"]
  pull_request:
    branches: ["astera-v3"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check new production modules
        run: |
          node --check firebase-sync.js
          node --check pro-features.js
      - name: Check required app wiring
        run: |
          grep -q 'firebase-sync.js' index.html
          grep -q 'pro-features.js' index.html
          test -f firebase-config.js
          test -f firestore.rules
          test -f MONTAZHI-AA-OPERATING.md
