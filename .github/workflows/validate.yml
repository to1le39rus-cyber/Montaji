name: Validate Montaji AA production

on:
  push:
    branches: ["Astera-smart", "product-overhaul-20260819", "design/master-redesign"]
  pull_request:
    branches: ["Astera-smart"]

jobs:
  syntax-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production regression suite
        run: npm test
      - name: Check production wiring
        run: |
          grep -E 'boot\.js\?v=' index.html
          test "$(grep -o 'type=\"module\"' index.html | wc -l)" -eq 1
          test -f firebase-config.js
          test -f firestore.rules
          test -f firebase.json
          test -f .firebaserc
      - name: Check Russian map routing
        run: |
          grep -F 'yandex.ru/maps' app.js
          grep -F '2gis.ru/search' app.js
          ! grep -F 'google.com/maps' app.js
      - name: Check security rules
        run: |
          grep -F 'request.auth != null' firestore.rules
          grep -F 'match /appData/shared' firestore.rules
          grep -F 'match /appData/notes' firestore.rules
      - name: Check legacy production wiring
        run: |
          ! grep -E 'v9.js|v9-compat|app-v[0-9]|firebase-sync|archive.js|enhancement-v8.js' index.html
      - name: Check clean secure preview architecture
        if: github.ref_name == 'design/master-redesign'
        run: |
          test -f secure-app/index.html
          test -f secure-app/boot.js
          test -f secure-app/montaji-clean.css
          test ! -f secure-app/notes-bridge.js
          test ! -f notes-ui.js
          ! grep -E 'notes-bridge|notes-ui|dark-theme|notes-theme|main-screen-final|MutationObserver|source\.replace' secure-app/index.html secure-app/boot.js
          ! grep -R '!important' secure-app/montaji-clean.css
          grep -F 'function renderInsight' app.js
          grep -F 'insight--urgent' app.js
