name: Validate Montaji AA

on:
  push:
    branches: ["Astera-smart"]
  pull_request:
    branches: ["Astera-smart"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production JavaScript syntax
        run: node --check app.js
      - name: Check production wiring
        run: |
          grep -F 'app.js?v=20260812-final1' index.html
          test -f firebase-config.js
          test -f firestore.rules
          ! grep -q 'localStorage' app.js
          ! grep -q 'firebase-sync.js' index.html
          ! grep -q 'app-v4.js' index.html
      - name: Check security rules
        run: |
          grep -F "request.auth.token.firebase.sign_in_provider != 'anonymous'" firestore.rules
          grep -F 'request.auth.token.email_verified == true' firestore.rules
