name: Validate Montaji AA production

on:
  push:
    branches: ["Astera-smart", "product-overhaul-20260819"]
  pull_request:
    branches: ["Astera-smart"]

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - run: node --version
      - run: npm --version
      - run: npm test

  production-wiring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - run: grep -E 'boot\.js\?v=' index.html
      - run: test "$(grep -o 'type=\"module\"' index.html | wc -l)" -eq 1
      - run: test -f firebase-config.js
      - run: test -f firestore.rules
      - run: test -f firebase.json
      - run: test -f .firebaserc

  russian-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - run: grep -F 'yandex.ru/maps' app.js
      - run: grep -F '2gis.ru/search' app.js
      - run: "! grep -F 'google.com/maps' app.js"

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - run: grep -F 'request.auth != null' firestore.rules
      - run: grep -F 'match /appData/shared' firestore.rules
      - run: grep -F 'match /appData/notes' firestore.rules

  legacy-wiring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - run: "! grep -E 'v9.js|v9-compat|app-v[0-9]|firebase-sync|archive.js|enhancement-v8.js' index.html"
