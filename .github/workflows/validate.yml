name: Validate Montaji AA

on:
  push:
    branches: ["astera-v3"]
  pull_request:
    branches: ["astera-v3"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app-v4.js
          node --check archive.js
          node --check firebase-sync.js
          node --check pro-features.js
