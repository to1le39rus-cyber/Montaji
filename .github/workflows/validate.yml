name: Validate Montaji AA v9

on:
  push:
    branches: ["v9-final"]
  pull_request:
    branches: ["Astera-smart"]

jobs:
  syntax-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check v9.js
      - name: Run regression tests
        run: npm test
      - name: Check production wiring
        run: |
          grep -F 'app.js?v=9-core-20260818' index.html
          grep -F 'v9.js?v=20260818-1' index.html
          test "$(grep -o 'type=\"module\"' index.html | wc -l)" -eq 1
          test -f firebase-config.js
          test -f firestore.rules
          test -f firebase.json
          test -f .firebaserc
      - name: Check Russian map routing
        run: |
          grep -F 'yandex.ru/maps' app.js
          grep -F '2gis.ru/search' app.js
          ! grep -F 'google.com/maps' app.js
      - name: Check security rules
        run: |
          grep -F "request.auth.token.firebase.sign_in_provider != 'anonymous'" firestore.rules
          grep -F 'request.auth.token.email_verified == true' firestore.rules
      - name: Check legacy production wiring
        run: |
          ! grep -E 'app-v[0-9]|firebase-sync|archive.js|enhancement-v8.js' index.html
