name: Run verified Firestore patch

on:
  push:

permissions:
  contents: write

jobs:
  patch-production-branch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Astera-smart
        shell: bash
        env:
          TARGET_BRANCH: Astera-smart
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly 1 occurrence, found {n}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          replace_once('app.js','db=fs.getFirestore(app);F={...fs,authMod};}','db=fs.initializeFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});F={...fs,authMod};}')
          replace_once('boot.js',"  source=source.replace(\n    'db=fs.getFirestore(app);',\n    'db=fs.getFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});'\n  );\n",'')
          replace_once('secure-app/index.html',"    source=source.replace('db=fs.getFirestore(app);','db=fs.getFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});');\n",'')

          p=Path('tests/final-architecture.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  assert.match(boot,/montageCount\\(d\\)/);\n  assert.match(boot,/conflict=null/);\n','')
          needle='  assert.match(app,/runTransaction/);\n'
          add='  assert.match(app,/initializeFirestore\\(app,\\{experimentalForceLongPolling:true,useFetchStreams:false\\}\\)/);\n'
          if s.count(needle)!=1: raise SystemExit('test insertion point not found')
          s=s.replace(needle,needle+add)
          p.write_text(s,encoding='utf-8')
          PY

          test "$(grep -R -F 'getFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false})' --include='*.js' --include='*.html' . | wc -l)" -eq 0
          test "$(grep -R -F 'initializeFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false})' --include='*.js' . | wc -l)" -eq 1
          npm test

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js boot.js secure-app/index.html tests/final-architecture.test.mjs
          git diff --cached --check
          git commit -m 'fix: use initializeFirestore for Firestore transport'
          git push origin "$TARGET_BRANCH"

          git checkout "${{ github.event.repository.default_branch }}"
          git rm .github/workflows/run-firestore-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary Firestore patch runner'
          git push origin "${{ github.event.repository.default_branch }}"
