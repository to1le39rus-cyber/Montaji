name: Apply Firestore transport fix

on:
  push:
    branches:
      - Astera-smart

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: use initializeFirestore for Firestore transport'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Astera-smart
          fetch-depth: 0

      - name: Apply surgical patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 occurrence, found {count}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          replace_once(
              'app.js',
              'db=fs.getFirestore(app);F={...fs,authMod};}',
              'db=fs.initializeFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});F={...fs,authMod};}'
          )

          replace_once(
              'boot.js',
              "  source=source.replace(\n    'db=fs.getFirestore(app);',\n    'db=fs.getFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});'\n  );\n",
              ''
          )

          replace_once(
              'secure-app/index.html',
              "    source=source.replace('db=fs.getFirestore(app);','db=fs.getFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});');\n",
              ''
          )

          p = Path('tests/final-architecture.test.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  assert.match(boot,/montageCount\\(d\\)/);\n  assert.match(boot,/conflict=null/);\n", '')
          needle = "  assert.match(app,/runTransaction/);\n"
          addition = "  assert.match(app,/initializeFirestore\\(app,\\{experimentalForceLongPolling:true,useFetchStreams:false\\}\\)/);\n"
          if s.count(needle) != 1:
              raise SystemExit('tests: insertion point not found exactly once')
          s = s.replace(needle, needle + addition)
          p.write_text(s, encoding='utf-8')

          for path in ['app.js','boot.js','secure-app/index.html','tests/final-architecture.test.mjs']:
              print(f'patched {path}')

      - name: Verify exact patch and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -R -F 'getFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false})' --include='*.js' --include='*.html' . | wc -l)" -eq 0
          test "$(grep -R -F 'initializeFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false})' --include='*.js' . | wc -l)" -eq 1
          npm test

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-firestore-transport-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js boot.js secure-app/index.html tests/final-architecture.test.mjs .github/workflows/apply-firestore-transport-fix.yml
          git diff --cached --check
          git commit -m 'fix: use initializeFirestore for Firestore transport'
          git push origin Astera-smart
