name: One-shot Today v1
on:
  push:
    branches: [Astera-smart]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Today screen refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('secure-app/index.html')
          s = p.read_text()
          marker = '/* TODAY_V1 */'
          if marker in s:
              raise SystemExit('already applied')
          css = r'''/* TODAY_V1 */
          #todayScreen{padding-bottom:8px!important}
          #todayScreen>.hero-card{position:relative!important;border-radius:24px!important;padding:18px 18px 16px!important;box-shadow:0 12px 34px rgba(31,43,34,.13)!important;overflow:hidden!important}
          #todayScreen>.hero-card:after{content:"";position:absolute;right:-34px;top:-42px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.055);pointer-events:none}
          #todayScreen .hero-row{position:relative;z-index:1;font-size:11px!important;letter-spacing:.01em!important}
          #todayScreen .hero-income{position:relative;z-index:1;font-size:40px!important;line-height:.98!important;margin-top:18px!important;letter-spacing:-.06em!important}
          #todayScreen .hero-label{position:relative;z-index:1;font-size:10px!important;margin-top:5px!important;opacity:.52!important}
          #todayScreen .hero-mini{position:relative;z-index:1;gap:22px!important;margin-top:17px!important;font-size:10px!important}
          #todayScreen .hero-mini b{font-size:13px!important;margin-top:3px!important}
          #todayScreen .progress{position:relative;z-index:1;height:4px!important;margin-top:15px!important}
          #todayScreen>.period-strip{grid-template-columns:1fr 1fr!important;gap:7px!important;margin:8px 0 22px!important}
          #todayScreen>.period-strip>div{border:0!important;border-radius:15px!important;padding:11px 13px!important;background:rgba(255,255,255,.72)!important;box-shadow:inset 0 0 0 1px var(--line)!important}
          #todayScreen .period-strip small{font-size:9px!important}
          #todayScreen .period-strip b{font-size:16px!important;margin-top:4px!important;letter-spacing:-.02em!important}
          #todayScreen>.section-head{margin:20px 2px 8px!important}
          #todayScreen>.section-head h2{font-size:16px!important;letter-spacing:-.025em!important}
          #todayScreen .quick-inline{gap:1px!important}
          #todayScreen .quick-inline .text-btn{font-size:11px!important;padding:6px 3px!important}
          #todayScreen #insights{border-top:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important}
          #todayScreen #insights .insight{min-height:42px!important;padding:8px 2px!important}
          #todayScreen #insights .note-insight-copy strong{font-size:13px!important;font-weight:650!important}
          #todayScreen #insights .note-insight-copy small{font-size:9px!important}
          #todayScreen #insights .note-insight-arrow{font-size:18px!important}
          #todayScreen>.job-list{gap:8px!important}
          #todayScreen .job-card{border-radius:19px!important;padding:14px!important;box-shadow:0 5px 20px rgba(20,30,22,.035)!important}
          #todayScreen .job-top{align-items:flex-start!important}
          #todayScreen .job-client{font-size:15px!important;line-height:1.2!important}
          #todayScreen .job-meta{font-size:10px!important;margin-top:3px!important}
          #todayScreen .amount{font-size:15px!important}
          #todayScreen .job-details{margin-top:9px!important;gap:5px!important}
          #todayScreen .detail-line{font-size:11px!important;line-height:1.35!important}
          #todayScreen .actions{margin-top:10px!important;gap:5px!important}
          #todayScreen .action-chip,#todayScreen .map-chip{border-radius:10px!important;padding:7px 9px!important;font-size:10px!important}
          #todayScreen .quick-actions{gap:5px!important;margin-top:8px!important;padding-top:8px!important}
          #todayScreen .quick-actions button{border-radius:10px!important;padding:8px 6px!important;font-size:10px!important}
          #todayScreen .inline-card{border-radius:18px!important;padding:13px!important;margin-top:10px!important}
          #todayScreen .inline-card .section-head{margin:0 0 7px!important}
          #todayScreen .inline-card .section-head h2{font-size:14px!important}
          #todayScreen>.upcoming-list{gap:0!important;border-top:1px solid var(--line)!important}
          #todayScreen .upcoming{border-radius:0!important;background:transparent!important;border-bottom:1px solid var(--line)!important;padding:10px 2px!important;grid-template-columns:32px minmax(0,1fr) auto 12px!important}
          #todayScreen .upcoming b{width:30px!important;height:30px!important;border-radius:10px!important;font-size:12px!important}
          #todayScreen .upcoming span{font-size:11px!important}
          #todayScreen .upcoming em{font-size:9px!important}
          #todayScreen .upcoming-list + .inline-card{margin-top:18px!important}
          #todayScreen .note-card{padding:9px 0!important}
          #todayScreen .note-top b{font-size:11px!important}
          #todayScreen .note-card p{font-size:11px!important;margin-top:5px!important}
          #todayScreen .archive-details{font-size:11px!important}
          @media(max-width:390px){#todayScreen .hero-income{font-size:37px!important}#todayScreen .hero-mini{gap:17px!important}#todayScreen .period-strip b{font-size:15px!important}}
          '''
          css = ' '.join(line.strip() for line in css.splitlines())
          needle = 'document.head.appendChild(style);'
          if needle not in s:
              raise SystemExit('insertion point not found')
          payload = css.replace('\\', '\\\\').replace('`','\\`').replace('${','\\${')
          s = s.replace(needle, "style.textContent += `" + payload + "`;" + needle, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure-app/index.html
          git commit -m "feat: refine Today screen v1"
          git push
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-today-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot Today workflow"
          git push
