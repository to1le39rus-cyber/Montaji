name: One-shot Today v2
on:
  push:
    branches: [Astera-smart]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('secure-app/index.html')
          s=p.read_text()
          if 'TODAY_V2' in s:
              raise SystemExit(0)
          css=Path('.github/today-v2.css').read_text()
          css=css.replace('`','\\`').replace('${','\\${')
          marker='/* TODAY_V1 */'
          i=s.find(marker)
          if i < 0:
              raise SystemExit('marker not found')
          s=s[:i] + css + s[i:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure-app/index.html
          git commit -m "feat: rebuild Today hierarchy v2"
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/one-shot-today-v2.yml .github/today-v2.css
          git add -A
          git commit -m "chore: remove Today v2 one-shot files"
          git push
