name: One-shot Today v2
on:
  push:
    branches: [Astera-smart]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Today hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('secure-app/index.html')
          s=p.read_text()
          marker='/* TODAY_V2 */'
          if marker in s: raise SystemExit('already applied')
          css=r'''/* TODAY_V2 */
          #todayScreen{padding-bottom:6px!important;background:#f7f7f4!important}
          #todayScreen .topbar{background:#f7f7f4!important}
          #todayScreen .hero-card{margin-top:8px!important;border-radius:22px!important;padding:17px 18px 15px!important;min-height:0!important;box-shadow:none!important;background:#17191d!important}
          #todayScreen .hero-row{font-size:11px!important;opacity:.62!important}
          #todayScreen .hero-row strong{font-size:11px!important;opacity:1!important}
          #todayScreen .hero-income{font-size:42px!important;line-height:.94!important;letter-spacing:-.065em!important;margin-top:16px!important}
          #todayScreen .hero-label{font-size:9px!important;letter-spacing:.08em!important;text-transform:uppercase!important;opacity:.42!important;margin-top:6px!important}
          #todayScreen .hero-mini{gap:28px!important;margin-top:16px!important;font-size:10px!important;opacity:.7!important}
          #todayScreen .hero-mini b{font-size:12px!important;margin-top:2px!important}
          #todayScreen .progress{height:3px!important;margin-top:14px!important;background:rgba(255,255,255,.10)!important}
          #todayScreen .period-strip{display:flex!important;gap:0!important;margin:10px 0 27px!important;background:transparent!important;border-bottom:1px solid #dedfd9!important}
          #todayScreen .period-strip>div{flex:1!important;border:0!important;border-radius:0!important;padding:9px 2px 11px!important;background:transparent!important;box-shadow:none!important}
          #todayScreen .period-strip>div+div{border-left:1px solid #dedfd9!important;padding-left:16px!important}
          #todayScreen .period-strip small{font-size:9px!important;letter-spacing:.08em!important;text-transform:uppercase!important;color:#8d8f89!important}
          #todayScreen .period-strip b{display:block!important;font-size:15px!important;line-height:1!important;margin-top:5px!important}
          #todayScreen>.section-head{margin:0 2px 7px!important;min-height:26px!important;align-items:center!important}
          #todayScreen>.section-head h2{font-size:17px!important;line-height:1!important;letter-spacing:-.035em!important}
          #todayScreen .quick-inline{gap:4px!important}
          #todayScreen .quick-inline .text-btn{font-size:11px!important;padding:4px 2px!important}
          #todayScreen #insights{border-top:1px solid #dedfd9!important;border-bottom:1px solid #dedfd9!important;margin-bottom:25px!important;max-height:172px!important}
          #todayScreen #insights .insight{min-height:43px!important;padding:8px 1px!important}
          #todayScreen #insights .note-insight-copy strong{font-size:13px!important;font-weight:650!important;color:#30312f!important}
          #todayScreen #insights .note-insight-copy small{font-size:9px!important}
          #todayScreen #insights .note-insight-arrow{font-size:17px!important}
          #todayScreen>.job-list{gap:7px!important}
          #todayScreen .job-card{border:1px solid #dedfd9!important;border-radius:18px!important;background:#fff!important;padding:14px 14px 12px!important;box-shadow:none!important}
          #todayScreen .job-top{align-items:flex-start!important}
          #todayScreen .job-client{font-size:17px!important;font-weight:700!important;letter-spacing:-.025em!important}
          #todayScreen .job-meta{font-size:10px!important;margin-top:4px!important;color:#7d807a!important}
          #todayScreen .amount{font-size:17px!important;font-weight:700!important}
          #todayScreen .job-details{margin-top:10px!important;gap:5px!important;border-top:1px solid #ecece8!important;padding-top:9px!important}
          #todayScreen .detail-line{font-size:11px!important;line-height:1.35!important;color:#62655f!important}
          #todayScreen .actions{margin-top:10px!important;gap:5px!important;flex-wrap:nowrap!important;overflow:hidden!important}
          #todayScreen .action-chip,#todayScreen .map-chip{border:0!important;border-radius:9px!important;padding:7px 9px!important;font-size:10px!important;white-space:nowrap!important;background:#f0f1ed!important}
          #todayScreen .quick-actions{gap:5px!important;margin-top:8px!important;padding-top:8px!important;border-top:1px solid #ecece8!important}
          #todayScreen .quick-actions button{border-radius:9px!important;padding:8px 6px!important;font-size:10px!important}
          #todayScreen .inline-card{border:0!important;border-top:1px solid #dedfd9!important;border-bottom:1px solid #dedfd9!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;padding:10px 2px!important;margin-top:21px!important}
          #todayScreen .inline-card .section-head{margin:0!important;min-height:27px!important}
          #todayScreen .inline-card .section-head h2{font-size:14px!important}
          #todayScreen .inline-card .section-head small{font-size:9px!important;color:#999b95!important}
          #todayScreen .inline-card .text-btn{font-size:11px!important;padding:5px 0!important}
          #todayScreen .inline-card:first-of-type #todayExpenses{display:none!important}
          #todayScreen .inline-card:last-of-type #activeNotes,#todayScreen .inline-card:last-of-type .archive-details{display:none!important}
          #todayScreen>.upcoming-list{gap:0!important;border-top:1px solid #dedfd9!important}
          #todayScreen .upcoming{border-radius:0!important;background:transparent!important;border-bottom:1px solid #dedfd9!important;padding:10px 2px!important;grid-template-columns:31px minmax(0,1fr) auto 12px!important}
          #todayScreen .upcoming b{width:29px!important;height:29px!important;border-radius:9px!important;background:#eaeee8!important;font-size:12px!important}
          #todayScreen .upcoming span{font-size:11px!important;font-weight:600!important}
          #todayScreen .upcoming em{font-size:9px!important;color:#858880!important}
          #todayScreen .fab{width:54px!important;height:54px!important;border-radius:18px!important;box-shadow:0 10px 25px rgba(65,70,170,.18)!important}
          .topbar{background:#f7f7f4!important;border-bottom:1px solid #dedfd9!important;padding-top:10px!important;padding-bottom:10px!important}
          .top-actions{gap:7px!important;min-width:0!important}
          .sync-dot{display:block!important;max-width:142px!important;min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:9px!important;letter-spacing:.06em!important}
          .circle-btn{flex:0 0 42px!important;width:42px!important;height:42px!important}
          .bottom-nav{height:58px!important;border-radius:18px!important;bottom:7px!important;padding:4px!important}
          .bottom-nav .nav{min-width:0!important}
          .bottom-nav .nav span{font-size:9px!important}
          .bottom-nav .nav small{font-size:9px!important}
          @media(max-width:390px){#todayScreen .hero-income{font-size:39px!important}#todayScreen .hero-mini{gap:20px!important}.sync-dot{max-width:128px!important}}
          '''
          css=' '.join(x.strip() for x in css.splitlines())
          needle='style.textContent += `/* TODAY_V1 */'
          if needle not in s: raise SystemExit('v1 insertion not found')
          payload=css.replace('\\','\\\\').replace('`','\\`').replace('${','\\${')
          s=s.replace(needle, 'style.textContent += `'+payload+'`;' + needle, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure-app/index.html
          git commit -m "feat: rebuild Today hierarchy v2"
          git push
      - name: Remove workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-today-v2.yml
          git add -A
          git commit -m "chore: remove one-shot Today v2 workflow"
          git push
