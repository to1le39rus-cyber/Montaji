name: One-shot Firebase auth persistence fix

on:
  push:
    branches: ["Astera-smart"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Auth initialization and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = "auth=authMod.getAuth(app);"
          new = "auth=authMod.initializeAuth(app,{persistence:[authMod.indexedDBLocalPersistence,authMod.browserLocalPersistence,authMod.browserSessionPersistence]});"
          if old not in s:
              raise SystemExit('Expected Firebase Auth initialization was not found; refusing to modify anything.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-auth-fix.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/one-shot-auth-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: persist Firebase auth across reloads"
          git push
