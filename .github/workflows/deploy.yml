name: Montaji AA — production

on:
  push:
    branches: ["Astera-smart"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: montaji-aa-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical production branch
        uses: actions/checkout@v4

      - name: Run zero-dependency regression tests
        run: npm test

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONTAG_39 }}'
          projectId: montaj-39
          channelId: live
