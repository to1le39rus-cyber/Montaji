name: Montaji AA — production

on:
  push:
    branches: ["Astera-smart"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montaji-aa-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply final notes architecture
        shell: bash
        run: |
          if grep -q 'data-note-done' app.js; then
            echo 'Notes architecture already applied.'
            exit 0
          fi
          echo 'aW1wb3J0IHJlIGZyb20gcGF0aGxpYiBpbXBvcnQgUGF0aAoKaXQ9UGF0aCgnYXBwLmpzJykKcD1pdAoK' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          python3 - <<'PY'
from pathlib import Path
p=Path('tests/final-architecture.test.mjs')
s=p.read_text()
s=s.replace("assert.match(app, /getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.SHARED_DOC\\)\\)/);\n  assert.match(app, /getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.NOTES_DOC\\)\\)/);\n  assert.match(app, /Promise\\.all\\(\\[/);", "assert.match(app, /const sharedSnap=await F\\.getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.SHARED_DOC\\)\\)/);\n  assert.match(app, /const notesSnap=await F\\.getDocFromServer\\(F\\.doc\\(db,\\.\\.\\.NOTES_DOC\\)\\)/);\n  assert.doesNotMatch(app, /const \\[sharedSnap,notesSnap\\]=await Promise\\.all/);")
p.write_text(s)
PY
          git config user.name 'montaji-bot'
          git config user.email 'montaji-bot@users.noreply.github.com'
          git add app.js tests/final-architecture.test.mjs
          git commit -m 'feat: finish notes workspace architecture'
          git push origin HEAD:Astera-smart

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run zero-dependency regression tests
        run: npm test

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase service account
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONTAG_39 }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firebase Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --project montaj-39 --only hosting,firestore:rules --non-interactive

      - name: Remove service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
