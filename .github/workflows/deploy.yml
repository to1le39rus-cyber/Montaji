name: Deploy Montaji AA v5

on:
  push:
    branches: ["v5-final"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: montaji-aa-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Firebase Hosting production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://montaj-39.web.app
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONTAG_39 }}'
          projectId: montaj-39
          channelId: live
