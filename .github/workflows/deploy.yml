name: Montaji AA — production

on:
  push:
    branches: ["Astera-smart"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montaji-aa-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical production branch
        uses: actions/checkout@v4

      - name: Apply safe in-app important patch
        run: python3 tools/patch-important-block.py

      - name: Commit in-app patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No app patch needed"
          else
            git commit -m "implement important block inside app"
            git push origin HEAD:Astera-smart
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run zero-dependency regression tests
        run: npm test

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase service account
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONTAG_39 }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firebase Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --project montaj-39 --only hosting,firestore:rules --non-interactive

      - name: Remove service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
