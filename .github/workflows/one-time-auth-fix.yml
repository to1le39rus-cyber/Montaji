name: One-time auth fix
on:
  push:
    branches: [Astera-smart]
permissions:
  contents: write
jobs:
  fix-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="if(!u.emailVerified){await F.authMod.signOut(auth);showAuth(true);authMessage('Подтвердите email по ссылке из письма.',true);return}"
          if old in s:
              s=s.replace(old,'')
              p.write_text(s)
              print('patched')
          else:
              print('gate already absent')
          PY
          rm -f .github/workflows/one-time-auth-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/one-time-auth-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: allow authenticated app access without email verification"
          git push
