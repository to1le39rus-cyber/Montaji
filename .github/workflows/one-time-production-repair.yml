name: one-time production repair

on:
  push:
    branches: ["Astera-smart"]

permissions:
  contents: write

jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, 'one-time production repair') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original transparent database auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "async function onUser(u){user=u;unsubscribeShared?.();unsubscribeNotes?.();unsubscribeShared=unsubscribeNotes=null;if(!u){serverReady=false;state=emptyState();notes=[];showAuth(true);render();status('Требуется вход');return}if(!u.emailVerified){await F.authMod.signOut(auth);showAuth(true);authMessage('Подтвердите email по ссылке из письма.',true);return}showAuth(false);if(await loadServer())startRealtime();}"
          new = "async function onUser(u){user=u;unsubscribeShared?.();unsubscribeNotes?.();unsubscribeShared=unsubscribeNotes=null;if(!u){serverReady=false;state=emptyState();notes=[];showAuth(false);render();status('Подключаем общую базу…');try{await F.authMod.signInAnonymously(auth)}catch(err){console.error('Anonymous auth failed',err);showAuth(true);authMessage('Не удалось подключиться к общей базе.',true);status('База недоступна','offline')}return}if(u.isAnonymous){showAuth(false);if(await loadServer())startRealtime();return}if(!u.emailVerified){await F.authMod.signOut(auth);showAuth(true);authMessage('Подтвердите email по ссылке из письма.',true);return}showAuth(false);if(await loadServer())startRealtime();}"
          if old not in s:
              raise SystemExit('expected onUser block not found')
          p.write_text(s.replace(old, new))
          PY
          cat > firestore.rules <<'EOF'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              // Original production contract: transparent Firebase anonymous auth.
              // Shared data is never migrated or deleted by these rules.
              function signedIn() {
                return request.auth != null;
              }

              match /appData/shared {
                allow read, write: if signedIn();
              }

              match /appData/notes {
                allow read, write: if signedIn();
              }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js firestore.rules
          git commit -m "fix: restore original transparent database auth"
          git push
