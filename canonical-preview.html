<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Монтажи АА — Canonical Preview</title>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/today.css">
<link rel="stylesheet" href="./src/styles/schedule.css">
<link rel="stylesheet" href="./src/styles/money.css">
<link rel="stylesheet" href="./src/styles/clients.css">
<link rel="stylesheet" href="./src/styles/notes-more.css">
<link rel="stylesheet" href="./src/styles/job-components.css">
</head>
<body>
<div id="fixture-picker" style="padding:16px;font:15px system-ui;max-width:720px;margin:auto"><strong>Canonical Preview</strong><p style="margin:8px 0">Выбери локальный JSON-бэкап Montaji. Файл останется в браузере и не загружается в GitHub/Firebase.</p><input id="fixture" type="file" accept=".json,application/json"><span id="fixture-status" style="display:block;margin-top:8px"></span></div><div id="app"></div>
<script type="module">
import { createCanonicalShell } from './src/core/canonical-shell.js';
import { normalizeState, normalizeNotes } from './src/domain/normalize.js';
const input=document.querySelector('#fixture'), status=document.querySelector('#fixture-status'), picker=document.querySelector('#fixture-picker'), root=document.querySelector('#app');
async function renderFile(file){
 try {
  status.textContent='Читаю JSON…';
  const json=JSON.parse(await file.text());
  const shared=normalizeState(json?.data);
  const notes=normalizeNotes(json?.notes);
  picker.innerHTML='<strong>Canonical Preview</strong><p style="margin:8px 0">Загружен локальный бэкап: '+file.name+' · заявок: '+shared.jobs.length+' · расходов: '+shared.expenses.length+' · заметок: '+notes.length+'</p><input id="fixture" type="file" accept=".json,application/json"><span id="fixture-status" style="display:block;margin-top:8px"></span>';
  picker.querySelector('#fixture').addEventListener('change',e=>e.target.files[0]&&renderFile(e.target.files[0]));
  root.replaceChildren();
  createCanonicalShell({root,initialState:shared,initialNotes:notes,user:null});
 } catch(e) { status.textContent='Ошибка JSON: '+e.message; }
}
input.addEventListener('change',e=>e.target.files[0]&&renderFile(e.target.files[0]));
</script>
</body>
</html>
