<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><meta name="color-scheme" content="light"><title>Монтажи АА</title><style>html,body{margin:0;height:100%;background:#f5f5f2}#boot{height:100%;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#171a17}#boot div{padding:20px;text-align:center}</style><link rel="preconnect" href="https://raw.githubusercontent.com"><link rel="dns-prefetch" href="//raw.githubusercontent.com"></head><body><div id="boot"><div>Загружаю Монтажи АА…</div></div><script type="module">(async()=>{const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';const get=async p=>{const r=await fetch(base+p+'?v=cupertino-v10',{cache:'force-cache'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()};try{const [index,styles,ux,premium,design,mobile,v9,v10,boot,config]=await Promise.all([get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('montaji-design-v2.css'),get('mobile-fixes.css'),get('montaji-product-v9.css'),get('montaji-cupertino-v10.css'),get('boot.js'),get('firebase-config.js')]);let h=index;h=h.replace(/<link rel="stylesheet"[^>]*>/g,'');h=h.replace('</head>',`<style id="app-styles">${styles}</style><style id="app-ux-styles">${ux}</style><style id="app-premium-styles">${premium}</style><style id="app-design-styles">${design}</style><style id="app-mobile-styles">${mobile}</style><style id="app-v9-styles">${v9}</style><style id="app-v10-styles">${v10}</style></head>`);h=h.replace(/<script[^>]+src="[^"]*boot\.js[^"]*"[^>]*><\/script>/g,'');h=h.replace(/<link rel="manifest"[^>]*>/g,'').replace(/<link rel="icon"[^>]*>/g,'');document.open();document.write(h);document.close();let b=boot;b=b.replace(/const APP_URL = new URL\([^\n]+\);/,`const APP_URL = new URL('${base}app.js?v=cupertino-v10');`);b=b.replace(/const CONFIG_URL = new URL\([^\n]+\);/,`const CONFIG_URL = '${base}firebase-config.js?v=cupertino-v10';`);b=b.replace('let source = await response.text();',`let source = await response.text();\n  source = source.replace("import { firebaseConfig } from './firebase-config.js';", ${JSON.stringify(config)});`);const s=document.createElement('script');s.type='module';s.textContent=b;document.body.appendChild(s)}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Не удалось загрузить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';console.error(e)}})();</script></body></html>
