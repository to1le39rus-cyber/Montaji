<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f1ec">
  <title>Монтажи АА</title>
</head>
<body>
  <div id="boot"><div>Загружаю Монтажи АА…</div></div>
  <script type="module">
    const branch = location.hostname.includes('git-feature-notes-v1-safe') ? 'feature/notes-v1-safe' : 'Astera-smart';
    const base = `https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/${branch}/`;

    async function get(path) {
      const response = await fetch(base + path, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${path} HTTP ${response.status}`);
      return response.text();
    }

    async function start() {
      const [index, bootSource, config] = await Promise.all([
        get('index.html'),
        get('boot.js'),
        get('firebase-config.js')
      ]);

      const parsed = new DOMParser().parseFromString(index, 'text/html');
      if (!parsed.head || !parsed.body) throw new Error('APP_HTML_INVALID');

      const links = [...parsed.head.querySelectorAll('link[rel="stylesheet"]')];
      await Promise.all(links.map(async link => {
        const href = link.getAttribute('href');
        if (!href) return;
        const cssPath = href.split('?')[0];
        const css = await get(cssPath);
        const style = document.createElement('style');
        style.textContent = css;
        style.dataset.source = cssPath;
        link.replaceWith(style);
      }));

      parsed.head.querySelectorAll('link[rel="manifest"],link[rel="icon"]').forEach(el => el.remove());
      parsed.body.querySelectorAll('script[src]').forEach(el => el.remove());

      document.title = parsed.title || 'Монтажи АА';
      document.head.replaceChildren(...[...parsed.head.childNodes].map(node => document.importNode(node, true)));
      document.body.replaceChildren(...[...parsed.body.childNodes].map(node => document.importNode(node, true)));

      let source = bootSource;
      source = source.replace(
        "const APP_URL = new URL('app.js?runtime=20260821-6', location.href);",
        `const APP_URL = new URL('${base}app.js');`
      );
      source = source.replace(
        "const themeCss=document.querySelector('link[href*=\"premium-field-tech.css\"]');",
        "const themeCss=document.querySelector('link[href*=\"premium-field-tech.css\"],style[data-source=\"premium-field-tech.css\"]');"
      );
      source = source.replace(
        "const notesCss=document.createElement('link');notesCss.rel='stylesheet';notesCss.href='notes-ui-fix.css?v=20260821-1';document.head.appendChild(notesCss);",
        "const notesCss=document.createElement('link');notesCss.rel='stylesheet';notesCss.href=`${base}notes-ui-fix.css?v=20260821-1`;document.head.appendChild(notesCss);"
      );
      source = source.replace(
        "const controlCss=document.createElement('link');controlCss.rel='stylesheet';controlCss.href='control-ui-fix.css?v=20260821-1';document.head.appendChild(controlCss);",
        "const controlCss=document.createElement('link');controlCss.rel='stylesheet';controlCss.href=`${base}control-ui-fix.css?v=20260821-1`;document.head.appendChild(controlCss);"
      );
      source = source.replace(
        "source = source.replace(\"import { firebaseConfig } from './firebase-config.js';\", ${JSON.stringify(config)});",
        `source = source.replace("import { firebaseConfig } from './firebase-config.js';", ${JSON.stringify(config)});`
      );

      const script = document.createElement('script');
      script.type = 'module';
      script.textContent = source;
      document.body.appendChild(script);
    }

    start().catch(error => {
      console.error('Montaji loader failed', error);
      document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#101828;text-align:center"><div><b>Не удалось загрузить приложение</b><br><small style="display:block;margin-top:10px;color:#667085">Проверьте интернет-соединение и обновите страницу.</small></div></div>';
    });
  </script>
</body>
</html>
