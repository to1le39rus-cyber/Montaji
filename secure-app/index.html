<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Монтажи АА</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f7fb}
    #boot{height:100%;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}
    #boot div{padding:20px;text-align:center}
  </style>
</head>
<body>
  <div id="boot"><div>Загружаю Монтажи АА…</div></div>
  <script type="module">
    (async()=>{
      const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';
      try{
        const get=async p=>{const r=await fetch(base+p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()};
        const [index,css,ux,premium,app,config]=await Promise.all([
          get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('app.js'),get('firebase-config.js')
        ]);
        let h=index;
        h=h.replace(/<link rel="stylesheet" href="styles\.css\?v=[^"]+">/,'<style>'+css+'</style>');
        h=h.replace(/<link rel="stylesheet" href="ux-upgrades\.css\?v=[^"]+">/,'<style>'+ux+'</style>');
        h=h.replace(/<link rel="stylesheet" href="premium-field-tech\.css\?v=[^"]+">/,'<style>'+premium+'</style>');
        h=h.replace(/<script type="module" src="boot\.js\?v=[^"]+"><\/script>/,'');
        h=h.replace(/<link rel="manifest" href="manifest\.json">/,'').replace(/<link rel="icon" href="icon\.svg">/,'');
        document.open();document.write(h);document.close();

        // Keep the canonical app source, but make the initial Firestore read
        // non-fatal. Realtime listeners are started independently so a single
        // failed server read (including the optional notes document) cannot
        // blank the working database. No stored data is changed here.
        let source=app.replace("import { firebaseConfig } from './firebase-config.js';",config);
        source=source.replace(
          /async function loadServer\(\)\{[\s\S]*?\n\}\nfunction startRealtime/,
          `async function loadServer(){if(!user||!online){serverReady=false;status('Нет интернета · данные не загружены','offline');return false;}status('Подключаем общую базу…');try{const sharedSnap=await F.getDocFromServer(F.doc(db,...SHARED_DOC));if(sharedSnap.exists()){state=normalize(sharedSnap.data().data);serverReady=true;render();status('● Общая база · синхронизировано','online')}else{state=emptyState();serverReady=true;render();status('● Общая база · синхронизировано','online')}try{const notesSnap=await F.getDocFromServer(F.doc(db,...NOTES_DOC));notes=currentNotesData(notesSnap);renderNotes()}catch(notesErr){console.warn('Notes read skipped:',notesErr)}return true}catch(err){console.error('Initial Firestore read failed; realtime path remains active:',err);status('Ожидаем связь с общей базой…','offline');return false;}}\nfunction startRealtime`
        );
        source=source.replace(
          /async function onUser\(u\)\{[\s\S]*?\n\}\n\(async\(\)=>\{/,
          `async function onUser(u){user=u;unsubscribeShared?.();unsubscribeNotes?.();unsubscribeShared=unsubscribeNotes=null;if(!u){serverReady=false;state=emptyState();notes=[];showAuth(true);render();status('Требуется вход');return}if(!u.emailVerified){await F.authMod.signOut(auth);showAuth(true);authMessage('Подтвердите email по ссылке из письма.',true);return}showAuth(false);startRealtime();await loadServer();}\n(async()=>{`
        );

        const script=document.createElement('script');
        script.type='module';
        script.textContent=source;
        document.body.appendChild(script);

        const retry=()=>window.dispatchEvent(new Event('online'));
        let attempts=0;
        const timer=setInterval(()=>{
          const status=document.querySelector('#syncStatus');
          if(!status)return;
          const text=status.textContent||'';
          if(/База недоступна|Нет связи с общей базой|Ожидаем связь/.test(text)&&attempts<8){attempts+=1;retry()}
          if(/синхронизировано|обновлено/.test(text))clearInterval(timer);
        },2000);

        const observer=new MutationObserver(()=>{
          const status=document.querySelector('#syncStatus');
          if(!status)return;
          const failed=/База недоступна|Нет связи с общей базой|Ожидаем связь/.test(status.textContent||'');
          let button=document.querySelector('#safeDbRetry');
          if(failed&&!button){
            button=document.createElement('button');
            button.id='safeDbRetry';
            button.type='button';
            button.textContent='Повторить подключение';
            button.style.cssText='position:fixed;z-index:9999;right:18px;top:112px;padding:10px 14px;border:0;border-radius:12px;background:#5f6d4c;color:#fff;font:600 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.15)';
            button.onclick=()=>{button.remove();retry()};
            document.body.appendChild(button);
          }
          if(!failed&&button)button.remove();
        });
        observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
      }catch(e){
        const el=document.getElementById('boot');
        if(el)el.innerHTML='<div><b>Не удалось загрузить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
