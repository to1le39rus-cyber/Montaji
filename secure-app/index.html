<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Монтажи АА</title>
<style>html,body{margin:0;height:100%;background:#f5f7fb}#boot{height:100%;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}#boot div{padding:20px;text-align:center}</style>
</head>
<body>
<div id="boot"><div>Загружаю Монтажи АА…</div></div>
<script type="module">
(async()=>{
  const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';
  const v='20260823-0112';
  try{
    const get=async p=>{const r=await fetch(base+p+'?v='+v,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()};
    const [index,css,ux,premium,config,notesCss,app,notesJs]=await Promise.all([
      get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('firebase-config.js'),get('notes.css'),get('app.js'),get('notes.js')
    ]);
    let h=index;
    h=h.replace(/<link rel="stylesheet" href="styles\.css\?v=[^"]+">/,'<style id="app-styles">'+css+'</style>');
    h=h.replace(/<link rel="stylesheet" href="ux-upgrades\.css\?v=[^"]+">/,'<style id="app-ux-styles">'+ux+'</style>');
    h=h.replace(/<link rel="stylesheet" href="premium-field-tech\.css\?v=[^"]+">/,'<style id="app-premium-styles">'+premium+'</style>');
    h=h.replace(/<script type="module" src="boot\.js\?v=[^\"]+">[\s\S]*?<\/script>/,'');
    h=h.replace(/<script type="module" src="notes\.js\?v=[^\"]+">[\s\S]*?<\/script>/,'');
    h=h.replace(/<script src="auth-guard\.js\?v=[^\"]+">[\s\S]*?<\/script>/,'');
    h=h.replace(/<link rel="manifest" href="manifest\.json">/,'').replace(/<link rel="icon" href="icon\.svg">/,'');
    h=h.replace('</head>','<style id="notes-styles">'+notesCss+'</style></head>');
    document.open();document.write(h);document.close();
    const match=config.match(/export\s+const\s+firebaseConfig\s*=\s*([\s\S]*?);\s*$/);
    if(!match)throw Error('Invalid Firebase config');
    const source=app.replace("import { firebaseConfig } from './firebase-config.js';",`const firebaseConfig=${match[1]};`);
    const appScript=document.createElement('script');
    appScript.type='module';
    appScript.textContent=source;
    appScript.dataset.appModule='1';
    document.body.appendChild(appScript);
    const ns=document.createElement('script');
    ns.type='module';
    ns.textContent=notesJs;
    ns.dataset.notesModule='1';
    document.body.appendChild(ns);
  }catch(e){
    console.error('Montaji production loader failed',e);
    const el=document.getElementById('boot');
    if(el)el.innerHTML='<div><b>Ошибка запуска приложения</b><br><small>Не удалось загрузить рабочий модуль. Обновите страницу.</small></div>';
  }
})();
</script>
</body>
</html>
