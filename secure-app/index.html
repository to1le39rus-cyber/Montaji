<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Монтажи АА</title>
<style>html,body{margin:0;min-height:100%;background:#f5f7fb}#boot{min-height:100vh;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}#boot div{padding:20px;text-align:center}#runtime-debug{position:fixed;left:16px;right:16px;bottom:24px;z-index:99999;background:#7f1d1d;color:#fff;border-radius:16px;padding:14px 16px;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 30px #0003;word-break:break-word;display:none}</style>
</head>
<body>
<div id="boot"><div>Загружаю Монтажи АА…</div></div>
<div id="runtime-debug"></div>
<script type="module">
(async()=>{
  const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';
  const version='20260823-production-clean-1';
  const debug=msg=>{const el=document.getElementById('runtime-debug');if(el){el.textContent='Ошибка запуска: '+msg;el.style.display='block'}};
  const get=async path=>{const r=await fetch(base+path+'?v='+version,{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.text()};
  try{
    const [index,css,ux,premium,config,notesCss,app]=await Promise.all([
      get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('firebase-config.js'),get('notes.css'),get('app.js')
    ]);

    // Existing application markup remains the source of truth. No document.write().
    const parsed=new DOMParser().parseFromString(index,'text/html');
    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;
    const addStyle=(id,text)=>{const s=document.createElement('style');s.id=id;s.textContent=text;document.head.appendChild(s)};
    addStyle('app-styles',css);addStyle('app-ux-styles',ux);addStyle('app-premium-styles',premium);addStyle('notes-styles',notesCss);

    // app.js is the single owner of Firebase + Notes. Remove legacy script tags from the fetched template.
    document.querySelectorAll('script[src]').forEach(s=>s.remove());

    const match=config.match(/export\s+const\s+firebaseConfig\s*=\s*([\s\S]*?);\s*$/);
    if(!match)throw Error('Invalid Firebase config');
    // Only the module-local config import is adapted because this production entrypoint is outside the app root.
    const source=app.replace("import { firebaseConfig } from './firebase-config.js';",`const firebaseConfig=${match[1]};`);
    const blobUrl=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    try{await import(blobUrl)}finally{URL.revokeObjectURL(blobUrl)}
  }catch(error){
    console.error('Montaji production bootstrap failed',error);
    debug(error?.code?`[${error.code}] ${error.message||''}`:(error?.message||String(error)));
    const boot=document.getElementById('boot');if(boot)boot.innerHTML='<div><b>Не удалось запустить приложение</b><br><small>Обновите страницу. Данные Firebase не изменялись.</small></div>';
  }
})();
</script>
</body>
</html>
