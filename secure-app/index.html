t=state.jobs.filter(j=>!isCancelled(j)&&!isDone(j)&&j.date<d).sort((a,b)=>a.date.localeCompare(b.date));","const list=state.jobs.filter(j=>j?.type==='Монтаж'&&j?.status==='Перенос').sort((a,b)=>a.date.localeCompare(b.date));");\n  source = source.replace("F.getDocFromServer(F.doc(db,...SHARED_DOC)),F.getDocFromServer(F.doc(db,...NOTES_DOC))","F.getDoc(F.doc(db,...SHARED_DOC)),F.getDoc(F.doc(db,...NOTES_DOC))");\n  source = source.replace("if(await loadServer())startRealtime();","startRealtime();loadServer();");\n  source += "\\nglobalThis.__montajiOpenOverdue=openOverdueJobs;\\n";`);const s=document.createElement('script');s.type='module';s.textContent=b;document.body.appendChild(s)}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Не удалось загрузить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';console.error(e)}})();</script></body></html>
