e("import { firebaseConfig } from './firebase-config.js';", "const firebaseConfig = {apiKey:'AIzaSyARuz40aEnYf9A0X8v5_5AN9pK58lfx0es',authDomain:'montaj-39.firebaseapp.com',projectId:'montaj-39',storageBucket:'montaj-39.firebasestorage.app',messagingSenderId:'1078766399423',appId:'1:1078766399423:web:9de0fabf89a5b1aeda3b0a',measurementId:'G-LJG1HV95BV'};`);source = source.replace("late=state.jobs.filter(j=>!isCancelled(j)&&!isDone(j)&&j.date<d).length","late=state.jobs.filter(j=>j?.type==='Монтаж'&&j?.status==='Перенос').length");source = source.replace("const d=today();const list=state.jobs.filter(j=>!isCancelled(j)&&!isDone(j)&&j.date<d).sort((a,b)=>a.date.localeCompare(b.date));","const list=state.jobs.filter(j=>j?.type==='Монтаж'&&j?.status==='Перенос').sort((a,b)=>a.date.localeCompare(b.date));");source = source.replace("F.getDocFromServer(F.doc(db,...SHARED_DOC)),F.getDocFromServer(F.doc(db,...NOTES_DOC))","F.getDoc(F.doc(db,...SHARED_DOC)),F.getDoc(F.doc(db,...NOTES_DOC))");source = source.replace("if(await loadServer())startRealtime();","startRealtime();loadServer();");source += "\nglobalThis.__montajiOpenOverdue=openOverdueJobs;\n";`);const blob=new Blob([b],{type:'text/javascript'});const url=URL.createObjectURL(blob);try{await import(url)}finally{URL.revokeObjectURL(url)}}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Не удалось запустить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';console.error(e)}})();</script></body></html>
