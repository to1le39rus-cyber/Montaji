<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>МОНТАЖИ AA</title>
</head>
<body>
<script>
(async()=>{
  const url='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/montaji-iphone-v2-sandbox/index.html';
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    document.open();document.write(await r.text());document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:-apple-system;padding:24px">Не удалось загрузить приложение.<br><small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
