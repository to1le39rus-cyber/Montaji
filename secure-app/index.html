","late=state.jobs.filter(j=>j?.type==='Монтаж'&&j?.status==='Перенос').length");\n  source = source.replace("const d=today();const list=state.jobs.filter(j=>!isCancelled(j)&&!isDone(j)&&j.date<d).sort((a,b)=>a.date.localeCompare(b.date));","const list=state.jobs.filter(j=>j?.type==='Монтаж'&&j?.status==='Перенос').sort((a,b)=>a.date.localeCompare(b.date));");\n  source = source.replace("F.getDocFromServer(F.doc(db,...SHARED_DOC)),F.getDocFromServer(F.doc(db,...NOTES_DOC))","F.getDoc(F.doc(db,...SHARED_DOC)),F.getDoc(F.doc(db,...NOTES_DOC))");\n  source = source.replace("if(await loadServer())startRealtime();","startRealtime();loadServer();");\n  source += `\n// PASS 05.3: premium Workday sheet presentation. Reuses existing business actions/data.\nopenDay = function(d){\n  const js=jobsForDate(d),pending=js.filter(j=>!isDone(j)),done=js.filter(isDone),t=dateTotals(d);\n  const planned=pending.filter(j=>j.type==='Монтаж').reduce((s,j)=>s+num(j.price||j.measurePrice),0);\n  const m=document.createElement('div'); m.className='modal open day-sheet-modal';\n  const totalPending=pending.filter(j=>j.type==='Монтаж').length;\n  m.innerHTML=\`<div class="backdrop"></div><div class="sheet day-sheet-final"><div class="handle"></div><div class="sheet-head"><div><div class="eyebrow">Рабочий день</div><h2>\${esc(fmtDate(d))}</h2></div><button class="circle-btn" data-close aria-label="Закрыть">×</button></div><div class="day-summary"><span>\${totalPending} \${totalPending===1?'выезд':'выезда'}</span><strong>План \${money(planned)}</strong></div><div class="day-stats"><div><small>Доход</small><b>\${money(t.income)}</b></div><div><small>Расход</small><b>− \${money(t.expenses)}</b></div><div><small>Чистыми</small><b>\${money(t.net)}</b></div></div><div class="day-actions"><button id="dayAdd">＋ Выезд</button><button id="dayExpense">− Расход</button><button id="dayNote">＋ Заметка</button></div><h3 class="sheet-section">План на день</h3><span class="sheet-plan-meta">\${totalPending} \${totalPending===1?'выезд':'выезда'} · \${money(planned)}</span><div class="timeline">\${['1','2','3'].map(s=>{const j=pending.find(x=>x.type==='Монтаж'&&String(x.slot)===s);return \`<div class="slot"><div class="slot-title">\${SLOTS[s]}</div>\${j?jobCard(j,{compact:true}):\`<button class="free-slot" data-slot="\${s}"><strong>＋ Свободное окно</strong><small>Добавить выезд на это время</small></button>\`}</div>\`}).join('')}\${pending.filter(j=>j.type!=='Монтаж').map(j=>\`<div class="slot"><div class="slot-title">\${esc(j.time||'Другой выезд')}</div>\${jobCard(j,{compact:true})}</div>\`).join('')}</div>\${done.length?\`<h3 class="sheet-section">История дня</h3>\${done.map(j=>jobCard(j,{compact:true})).join('')}\`:''}<button class="day-history" id="archiveDay">☷ &nbsp; Показать историю дня</button></div>\`;\n  document.body.append(m);\n  const close=()=>{m.remove();document.body.classList.toggle('modal-open',!!document.querySelector('.modal.open'))};\n  m.querySelector('.backdrop').onclick=close; m.querySelector('[data-close]').onclick=close;\n  m.querySelector('#dayAdd').onclick=()=>{m.remove();openJob(null,d,freeSlot(d),'Монтаж')};\n  m.querySelector('#dayExpense').onclick=()=>{m.remove();openExpense(d)};\n  m.querySelector('#dayNote').onclick=()=>{m.remove();openNote()};\n  m.querySelector('#archiveDay').onclick=()=>{m.remove();showDayArchive(d)};\n  m.querySelectorAll('.free-slot').forEach(btn=>btn.onclick=()=>{m.remove();openJob(null,d,btn.dataset.slot,'Монтаж')});\n  m.querySelectorAll('.edit').forEach(btn=>btn.onclick=()=>{m.remove();openJob(btn.dataset.id)});\n  bindQuickActions(m);\n  document.body.classList.add('modal-open');\n};\n`;const s=document.createElement('script');s.type='module';s.textContent=b;document.body.appendChild(s)}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Не удалось загрузить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';console.error(e)}})();</script></body></html>
