<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Монтажи АА</title>
<style>html,body{margin:0;min-height:100%;background:#f5f7fb}#boot{min-height:100vh;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}#boot div{padding:20px;text-align:center}#runtime-debug{position:fixed;left:16px;right:16px;bottom:24px;z-index:99999;background:#7f1d1d;color:#fff;border-radius:16px;padding:14px 16px;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 30px #0003;word-break:break-word;display:none}</style>
</head>
<body>
<div id="boot"><div>Загружаю Монтажи АА…</div></div>
<div id="runtime-debug"></div>
<script type="module">
(async()=>{
  const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';
  const version='20260823-production-clean-2';
  const debug=msg=>{const el=document.getElementById('runtime-debug');if(el){el.textContent='Ошибка запуска: '+msg;el.style.display='block'}};
  const get=async path=>{const r=await fetch(base+path+'?v='+version,{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.text()};
  try{
    const [index,css,ux,premium,config,notesCss,app]=await Promise.all([get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('firebase-config.js'),get('notes.css'),get('app.js')]);
    const parsed=new DOMParser().parseFromString(index,'text/html');
    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;
    const addStyle=(id,text)=>{const s=document.createElement('style');s.id=id;s.textContent=text;document.head.appendChild(s)};
    addStyle('app-styles',css);addStyle('app-ux-styles',ux);addStyle('app-premium-styles',premium);addStyle('notes-styles',notesCss);
    document.querySelectorAll('script[src]').forEach(s=>s.remove());
    const match=config.match(/export\s+const\s+firebaseConfig\s*=\s*([\s\S]*?);\s*$/);if(!match)throw Error('Invalid Firebase config');
    let source=app.replace("import { firebaseConfig } from './firebase-config.js';",`const firebaseConfig=${match[1]}`);

    // Functional production fixes. No data is changed: these only correct rendering/auth boot behaviour.
    source=source.replace("$('#todayNoteBtn').onclick=()=>openNote();","if($('#todayNoteBtn'))$('#todayNoteBtn').onclick=()=>openNote();");
    source=source.replace("status('База недоступна','offline');toast('Не удалось получить данные с сервера.','error');","status('База недоступна','offline');toast('Ошибка Firebase: '+(err?.code||err?.message||'unknown'),'error');");
    source=source.replace(/function renderToday\(\)\{[\s\S]*?\}function renderExpensesToday/,`function renderToday(){const d=today(),jobs=jobsForDate(d),t=totals('day'),w=totals('week'),m=totals('month');$('#topDate').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());$('#todayIncome').textContent=money(t.net);$('#todayGross').textContent=money(t.income);$('#todayExpense').textContent=money(t.expenses);$('#todayLoad').textContent=\`${montageCount(d)}/3\`;$('#todayProgress').style.width=Math.min(100,montageCount(d)/3*100)+'%';$('#todayWeek').textContent=money(w.net);$('#todayMonth').textContent=money(m.net);const advice=[],now=new Date(),dow=now.getDay(),weekend=dow===0||dow===6,nextMonday=new Date(now);nextMonday.setDate(now.getDate()+(dow===0?1:8-dow));nextMonday.setHours(0,0,0,0);const nextSunday=new Date(nextMonday);nextSunday.setDate(nextMonday.getDate()+6);const nk1=dateKey(nextMonday),nk2=dateKey(nextSunday),nextWeekJobs=state.jobs.filter(j=>!isCancelled(j)&&j.type==='Монтаж'&&j.date>=nk1&&j.date<=nk2),nextWeekIncome=nextWeekJobs.reduce((sum,j)=>sum+num(j.price),0),tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);const tc=montageCount(dateKey(tomorrow)),late=state.jobs.filter(j=>!isCancelled(j)&&!isDone(j)&&j.date<d).length;if(weekend){advice.push('🌿 Сегодня выходной — монтажей нет, можно спокойно выдохнуть и восстановиться.');if(nextWeekJobs.length)advice.push(\`💰 На следующую неделю уже запланировано \${nextWeekJobs.length} \${nextWeekJobs.length===1?'монтаж':'монтажа'} на \${money(nextWeekIncome)}.\`);else advice.push('✨ На следующую неделю пока нет монтажей — можно спокойно добрать график.');}else{if(late)advice.push(\`⚠️ \${late} просроченных выездов\`);if(tc===3)advice.push('🔥 Завтра 3/3 монтажей — день полностью загружен');else if(tc===2)advice.push('✨ Завтра осталось одно монтажное окно');if(t.unpaid)advice.push(\`💰 \${money(t.unpaid)} ещё не оплачено\`);if(nextWeekJobs.length)advice.push(\`📈 Следующая неделя: \${nextWeekJobs.length} монтажей · \${money(nextWeekIncome)} по плану\`);}$('#insights').innerHTML=advice.slice(0,3).map((x,i)=>{const cls=x.includes('не оплачено')?'insight money-insight':(weekend&&i===0?'insight weekend-insight':'insight');return x.includes('не оплачено')?\`<button class="\${cls}" data-open-debts="1">\${x}<span>›</span></button>\`:\`<div class="\${cls}">\${x}</div>\`}).join('')||'<div class="insight calm">✨ На сегодня всё спокойно</div>';$('#todayList').innerHTML=jobs.length?jobs.sort((a,b)=>String(a.slot).localeCompare(String(b.slot))).map(jobCard).join(''):'<div class="empty-card"><strong>Сегодня свободно</strong><span>'+ (weekend?'Воскресенье — отдыхай. Ближайшие монтажи уже ниже.':'Добавь монтаж, замер или расход через +') +'</span></div>';const upcoming=[];for(let i=1;i<=7;i++){const x=new Date();x.setDate(x.getDate()+i);const k=dateKey(x),js=activeJobs(k);if(js.length)upcoming.push({k,x,js});}$('#upcoming').innerHTML=upcoming.slice(0,5).map(o=>\`<button class="upcoming" data-date="\${o.k}"><b>\${o.x.getDate()}</b><span>\${esc(o.js[0].client||o.js[0].type)}</span><em>\${o.js.length} выезд · \${money(o.js.reduce((s,j)=>s+(j.price||j.measurePrice||0),0))}</em>›</button>\`).join('')||'<div class="muted">Ближайшие дни свободны.</div>';renderExpensesToday();renderNotes();bindCards();}function renderExpensesToday`);
    source=source.replace(/function renderCalendar\(\)\{[\s\S]*?\}function openDay/,`function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),historyStart='2026-08-10';let h='';for(let i=0;i<start;i++)h+='<div class="day blank"></div>';for(let n=1;n<=last;n++){const k=dateKey(new Date(y,m,n)),all=jobsForDate(k),montages=all.filter(j=>j.type==='Монтаж'),active=montages.filter(j=>!isDone(j)),done=montages.filter(isDone),measures=all.filter(isMeasure),past=k<today()&&k>=historyStart,hasMeasure=measures.length>0,dayIncome=dateTotals(k).income,c=active.length,load=past?\`\${done.length} ✓ · \${montages.length} всего\`:\`\${c}/3\`,sub=past?(dayIncome?money(dayIncome):\`\${montages.length} монтаж\${montages.length===1?'':'а'}\`):(montages.length?\`\${montages.length} монтаж\${montages.length===1?'':'а'}\`:'0 выезд');h+=\`<button class="day \${c>=3?'full':c===2?'busy':c?'partial':''} \${past?'past':''} \${done.length?'has-done':''} \${hasMeasure?'has-measure':''} \${k===today()?'today':''}" data-date="\${k}"><b>\${n}</b><span>\${sub}</span><i>\${load}\${hasMeasure?' · замер':''}</i></button>\`;}$('#scheduleMonth').textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(month);$('#calendar').innerHTML=h;$$('.day[data-date]').forEach(b=>b.onclick=()=>openDay(b.dataset.date));}function openDay`);
    source=source.replace("async function onUser(u){user=u;unsubscribeShared?.();unsubscribeNotes?.();unsubscribeShared=unsubscribeNotes=null;if(!u){serverReady=false;state=emptyState();notes=[];showAuth(true);render();status('Требуется вход');return}if(!u.emailVerified){await F.authMod.signOut(auth);showAuth(true);authMessage('Подтвердите email по ссылке из письма.',true);return}showAuth(false);if(await loadServer())startRealtime();}","async function onUser(u){user=u;unsubscribeShared?.();unsubscribeNotes?.();unsubscribeShared=unsubscribeNotes=null;if(!u){serverReady=false;state=emptyState();notes=[];showAuth(true);render();status('Требуется вход');return}if(!u.emailVerified){await F.authMod.signOut(auth);showAuth(true);authMessage('Подтвердите email по ссылке из письма.',true);return}showAuth(false);try{await u.getIdToken(true)}catch(tokenErr){console.error('Firebase ID token refresh failed',tokenErr);status('Не удалось подтвердить сессию','offline');toast('Ошибка авторизации: '+(tokenErr?.code||'token-refresh-failed'),'error');return}if(await loadServer())startRealtime();}");
    source=source.replace("async function loadServer(){if(!user||!online){serverReady=false;state=emptyState();notes=[];render();status('Нет интернета · данные не загружены','offline');return false;}status('Подключаем общую базу…');try{const [sharedSnap,notesSnap]=await Promise.all([F.getDocFromServer(F.doc(db,...SHARED_DOC)),F.getDocFromServer(F.doc(db,...NOTES_DOC))]);state=sharedSnap.exists()?normalize(sharedSnap.data().data):emptyState();notes=currentNotesData(notesSnap);serverReady=true;render();status('● Общая база · синхронизировано','online');return true;}catch(err){console.error(err);serverReady=false;state=emptyState();notes=[];render();status('База недоступна','offline');toast('Не удалось получить данные с сервера.','error');return false;}}","async function loadServer(){if(!user||!online){serverReady=false;state=emptyState();notes=[];render();status('Нет интернета · данные не загружены','offline');return false;}status('Подключаем общую базу…');try{const sharedSnap=await F.getDocFromServer(F.doc(db,...SHARED_DOC));state=sharedSnap.exists()?normalize(sharedSnap.data().data):emptyState();serverReady=true;render();status('● Общая база · синхронизировано','online');try{const notesSnap=await F.getDocFromServer(F.doc(db,...NOTES_DOC));notes=currentNotesData(notesSnap);renderNotes()}catch(notesErr){console.warn('notes load failed',notesErr);notes=[];renderNotes()}return true;}catch(err){console.error(err);serverReady=false;state=emptyState();notes=[];render();status('База недоступна','offline');toast('Ошибка Firebase: '+(err?.code||err?.message||'unknown'),'error');return false;}}");

    const blobUrl=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    try{await import(blobUrl)}finally{URL.revokeObjectURL(blobUrl)}
  }catch(error){
    console.error('Montaji production bootstrap failed',error);
    debug(error?.code?`[${error.code}] ${error.message||''}`:(error?.message||String(error)));
    const boot=document.getElementById('boot');if(boot)boot.innerHTML='<div><b>Не удалось запустить приложение</b><br><small>Обновите страницу. Данные Firebase не изменялись.</small></div>';
  }
})();
</script>
</body>
</html>
