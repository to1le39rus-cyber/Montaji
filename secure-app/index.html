<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Монтажи АА</title>
<style>html,body{margin:0;height:100%;background:#f5f7fb}#boot{height:100%;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}#boot div{padding:20px;text-align:center}</style>
</head>
<body>
<div id="boot"><div>Загружаю Монтажи АА…</div></div>
<script type="module">
(async()=>{
  const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';
  try{
    const get=async p=>{const r=await fetch(base+p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()};
    const [index,css,ux,premium,config,notesCss,boot,notesJs]=await Promise.all([
      get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('firebase-config.js'),get('notes.css'),get('boot.js'),get('notes.js')
    ]);
    let h=index;
    h=h.replace(/<link rel="stylesheet" href="styles\.css\?v=[^"]+">/,'<style id="app-styles">'+css+'</style>');
    h=h.replace(/<link rel="stylesheet" href="ux-upgrades\.css\?v=[^"]+">/,'<style id="app-ux-styles">'+ux+'</style>');
    h=h.replace(/<link rel="stylesheet" href="premium-field-tech\.css\?v=[^"]+">/,'<style id="app-premium-styles">'+premium+'</style>');
    h=h.replace(/<script type="module" src="boot\.js\?v=[^\"]+">[\s\S]*?<\/script>/,'');
    h=h.replace(/<script type="module" src="notes\.js\?v=[^\"]+">[\s\S]*?<\/script>/,'');
    h=h.replace(/<script src="auth-guard\.js\?v=[^\"]+">[\s\S]*?<\/script>/,'');
    h=h.replace(/<link rel="manifest" href="manifest\.json">/,'').replace(/<link rel="icon" href="icon\.svg">/,'');
    h=h.replace('</head>','<style id="notes-styles">'+notesCss+'</style></head>');
    document.open();document.write(h);document.close();

    const cfg=JSON.stringify(config);
    let b=boot
      .replace("import { firebaseConfig } from './firebase-config.js';",`const firebaseConfig=${cfg};`)
      .replace(/const APP_URL = new URL\('[^']+'\s*,\s*location\.href\);/,`const APP_URL = new URL('${base}app.js');`);
    const bs=document.createElement('script');bs.type='module';bs.textContent=b;document.body.appendChild(bs);

    const ns=document.createElement('script');ns.type='module';ns.textContent=notesJs;ns.dataset.notesModule='1';document.body.appendChild(ns);
  }catch(e){
    const el=document.getElementById('boot');
    if(el)el.innerHTML='<div><b>Не удалось загрузить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';
    console.error('Montaji production adapter failed',e);
  }
})();
</script>
</body>
</html>
