<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Монтажи АА</title>
  <style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}</style>
</head>
<body>
  <div id="boot">Загружаю Монтажи АА…</div>
  <script type="module">
  const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/c45c88f85e2a98a0ece9c157473c20f36e273c02/';
  (async()=>{try{
    const get=async p=>{const r=await fetch(base+p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()};
    const [index,css,ux,premium,boot,config]=await Promise.all([get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('boot.js'),get('firebase-config.js')]);
    let h=index;
    h=h.replace(/<link rel="stylesheet" href="styles\.css\?v=[^"]+">/,'<style>'+css+'</style>');
    h=h.replace(/<link rel="stylesheet" href="ux-upgrades\.css\?v=[^"]+">/,'<style>'+ux+'</style>');
    h=h.replace(/<link rel="stylesheet" href="premium-field-tech\.css\?v=[^"]+">/,'<style>'+premium+'</style>');
    h=h.replace(/<script type="module" src="boot\.js\?v=[^"]+"><\/script>/,'');
    document.open();document.write(h);document.close();
    let b=boot;
    b=b.replace(/const APP_URL = new URL\('app\.js\?[^']*', location\.href\);/,`const APP_URL = new URL('${base}app.js');`);
    b=b.replace('let source = await response.text();',`let source = await response.text();
  source = source.replace("import { firebaseConfig } from './firebase-config.js';", ${JSON.stringify(config)});
  source = source.replace("$('#insights').innerHTML=", "const urgentNotes=notes.filter(n=>n.archived!==true&&/срочно|‼️|‼/.test(String(n.title||'')+' '+String(n.text||'')));urgentNotes.slice(0,2).reverse().forEach(n=>advice.unshift('‼️ '+esc(n.title||'Срочно')+(n.text?' · '+esc(String(n.text).slice(0,140)):'')));$('#insights').innerHTML=");`);
    const s=document.createElement('script');s.type='module';s.textContent=b;document.body.appendChild(s);
  }catch(e){document.getElementById('boot').innerHTML='<div>Не удалось загрузить приложение<br><small>'+String(e?.message||e)+'</small></div>';console.error(e)}})();
  </script>
</body>
</html>
