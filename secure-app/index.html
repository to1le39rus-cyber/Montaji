<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Монтажи АА</title><style>html,body{margin:0;height:100%;background:#f5f7fb}#boot{height:100%;display:grid;place-items:center;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}#boot div{padding:20px;text-align:center}</style></head><body><div id="boot"><div>Загружаю Монтажи АА…</div></div><script type="module">(async()=>{const base='https://raw.githubusercontent.com/to1le39rus-cyber/Montaji/Astera-smart/';try{const get=async p=>{const r=await fetch(base+p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()};const [index,css,ux,premium,config,notesCss,appJs,notesJs]=await Promise.all([get('index.html'),get('styles.css'),get('ux-upgrades.css'),get('premium-field-tech.css'),get('firebase-config.js'),get('notes.css'),get('app.js'),get('notes.js')]);let h=index;h=h.replace(/<link rel="stylesheet" href="styles\.css\?v=[^"]+">/,'<style id="app-styles">'+css+'</style>');h=h.replace(/<link rel="stylesheet" href="ux-upgrades\.css\?v=[^"]+">/,'<style id="app-ux-styles">'+ux+'</style>');h=h.replace(/<link rel="stylesheet" href="premium-field-tech\.css\?v=[^"]+">/,'<style id="app-premium-styles">'+premium+'</style>');h=h.replace(/<script type="module" src="boot\.js\?v=[^"]+"><\\/script>/,'');h=h.replace(/<script type="module" src="notes\.js\?v=[^"]+"><\\/script>/,'');h=h.replace(/<script src="auth-guard\.js\?v=[^"]+"><\\/script>/,'');h=h.replace(/<link rel="manifest" href="manifest\.json">/,'').replace(/<link rel="icon" href="icon\.svg">/,'');h=h.replace('</head>','<style id="notes-styles">'+notesCss+'</style></head>');document.open();document.write(h);document.close();const cfg=JSON.stringify(config);let source=appJs.replace("import { firebaseConfig } from './firebase-config.js';",`const firebaseConfig=${cfg};`);source=source.replace(/function montageCount\(d\)\{[\s\S]*?function periodBounds/,"function montageCount(d){return jobsForDate(d).filter(j=>j.type==='Монтаж').length;} function freeSlot(d){return '1';}\nfunction periodBounds");source=source.replace(/const conflict=editingType==='Монтаж'&&state\.jobs\.find\([\s\S]*?\);/g,'const conflict=null;');source=source.replace(/const conflict=state\.jobs\.find\([\s\S]*?\);if\(conflict\)return toast\(`Слот занят: \$\{conflict\.client\}`,'error'\)/g,'const conflict=null;');source=source.replace("$('#todayLoad').textContent=`${montageCount(d)}/3`;","$('#todayLoad').textContent=String(montageCount(d));");source=source.replace("$('#todayProgress').style.width=Math.min(100,montageCount(d)/3*100)+'%';","$('#todayProgress').style.width=montageCount(d)>0?'100%':'0%';");source=source.replace("if(tc===3)advice.push('🔥 Завтра 3/3 монтажей — день полностью загружен');else if(tc===2)advice.push('✨ Завтра осталось одно монтажное окно');","if(tc>0)advice.push(`✨ Завтра запланировано ${tc} монтажей`);");source=source.replace(/\$\{c>=3\?'full':c===2\?'busy':c\?'partial':''\}/,"${c>0?'busy':''}");source=source.replace(/\$\{c\}\/3/g,'${c}');source=source.replace(/if\(!u\.emailVerified\)\{[\s\S]*?return\}/,'');const a=document.createElement('script');a.type='module';a.textContent=source;document.body.appendChild(a);const n=document.createElement('script');n.type='module';n.textContent=notesJs;n.dataset.notesModule='1';document.body.appendChild(n)}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Не удалось загрузить приложение</b><br><small>'+String(e?.message||e)+'</small></div>';console.error(e)}})();</script></body></html>
